[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/trail-collector",
    "tests/fixtures/mock-ssh-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
authors = ["Pedro Tramontin <pedro@example.com>"]
repository = ""  # Filled in once repo URL is known

[workspace.dependencies]
# Shared deps — pinned once at the workspace level.
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-os = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "1.0.69"
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
ssh2 = "0.9.6"
async-trait = "0.1.92"
ssh-key = { version = "0.6.7", features = ["ed25519", "rand_core", "getrandom"] }
keyring = { version = "3.6.3", features = ["apple-native", "linux-native", "windows-native"] }
zeroize = { version = "1.9.0", features = ["derive"] }
walkdir = "2.5.0"
tempfile = "3.27.0"
icalendar = "0.17.13"
tokio-cron-scheduler = "0.15.1"
# Phase 3 — summarizer + anonymizer + scheduler notifications.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
regex = "1.13.1"
once_cell = "1.21.4"
notify-rust = "4.18.0"
humantime = "2.4.0"
# HTTP mock server for the ollama client unit tests (no live ollama needed).
wiremock = "0.6.5"
sha2 = "0.10"
# Phase 5 §5.1 — whisper model download + audio capture.
#
# The default feature set (used by the collector crate, which
# doesn't link whisper.cpp) is empty — the GPU backends are
# activated per-target below because each GPU feature requires
# matching SDK + system libraries at *build* time. whisper-rs
# itself has no runtime `install_gpu()` call; GPU selection is a
# compile-time decision wired into whisper.cpp's CMake.
#
# Per-target feature splits:
#
#   - macOS:        `metal`     (Apple Metal framework ships
#                                with the OS; ggml-metal's CMake
#                                builds cleanly on darwin).
#   - Linux:        `vulkan`    (Mesa RADV / NVK / AMDVLK
#                                drivers are packaged as
#                                `libvulkan1` / `mesa-vulkan-drivers`
#                                on every distro; whisper-rs-sys
#                                links `-lvulkan` directly
#                                without an SDK install on Linux).
#   - Windows:      `vulkan`    (DirectML is built into whisper.cpp
#                                unconditionally so the DX12 path
#                                is available without a separate
#                                Cargo feature; Vulkan is added
#                                for NVIDIA / AMD / Intel GPUs
#                                that prefer it).
#
# §5b D1: `cuda` is INTENTIONALLY OMITTED (anywhere). whisper-rs-sys's
# `cuda` feature pulls in the NVIDIA CUDA Toolkit at *build* time
# — not just a runtime library, the full `nvcc` + `libcublas` +
# `libcudart` SDK (~5 GB). Our build host has neither
# `/usr/local/cuda` nor `nvcc`, and the GitHub Actions runners
# don't ship the NVIDIA driver. NVIDIA users still get GPU
# acceleration on Linux + Windows via the `vulkan` backend (the
# NVIDIA proprietary Vulkan driver + the open-source NVK both
# expose the CUDA compute surface through Vulkan 1.3+).
#
# §5b D2: `metal` is gated to macOS-only. whisper-rs-sys's
# `build.rs` unconditionally sets `GGML_METAL=ON` when the
# `metal` feature is on — even on Linux, where ggml-metal's
# CMake can't find the Apple Foundation framework (a macOS
# system library). The per-target feature split below avoids
# the cross-build failure while keeping Metal enabled for the
# macOS runner.
whisper-rs = { version = "0.16.0", default-features = false }
hound = "3.5.1"
# dirs 5 → 6: dirs 5 used `dirs-sys 0.4` which still pulls in
# `redox_users 0.4` (via the implicit `dirs-sys` chain); mainline has
# moved to `dirs 6` (single version) and we adopt that here to avoid
# keeping two copies of `dirs` and `redox_users` in the lockfile.
dirs = "6"
# Phase 5 §5.2 — cpal microphone capture (macOS) + cross-platform rubato
# resampler to 16 kHz mono for whisper.
cpal = "0.18.1"
rubato = "0.16.2"
# Phase 5 §5.3 — global-hotkey for the push-to-talk shortcut. Gated to
# macOS in src-tauri/Cargo.toml (Linux builds don't need it; the parser
# + tests run on Linux against a stub).
global-hotkey = "0.8.0"
# Phase 5 §5.4 — CancellationToken for the tray-icon blink loop.
tokio-util = "0.7.19"
# Phase 5 §5.5 — parking_lot::Mutex wraps the lazy whisper context
# (faster than std::sync::Mutex under low contention), and uuid
# provides v4 entry_ids for voice store entries.
parking_lot = "0.12.5"
uuid = { version = "1.25.0", features = ["v4"] }
# Phase 5 §5.7+ — rusqlite for the browser-history collector (plan
# `.hermes/plans/2026-08-11_browser-history-collector.md`). The
# `bundled` feature pulls a vendored SQLite into the static musl
# build that ships to the VPS, so we don't need libsqlite3 on the
# VPS image. ~700KB added to the binary. FTS5 is included
# automatically via `bundled → modern_sqlite`. rusqlite 0.32
# (rather than 0.36+) is intentional — 0.36 introduced breaking
# changes around `params_from_iter` and the `Value` enum
# separation; the workspace's other crates still target 0.32-era
# APIs so we pin at the more conservative version.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# Phase 5 §5.7 — macOS mic permission detection via `objc2` (the modern
# safe wrapper around Apple's Objective-C runtime). The trio of
# `objc2` + `objc2-foundation` + `block2` is the standard macOS bindings
# stack. Pinned at the workspace level so every member that needs them
# resolves to one version. `target_os = "macos"` gate is downstream —
# these crates don't compile on Linux (block2 + objc2 both transitively
# link CoreFoundation) so they only land on macOS at the call site.
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
block2 = "0.6.2"
# macOS EventKit binding for the calendar collector's macOS binary
# build. Pinned to 0.3.2 (the current as of 2026-08-11) which is
# the series that pairs with `objc2 0.6.x`. The 0.3.x line of
# `objc2-event-kit` matches the `objc2 0.6.4` + `objc2-foundation
# 0.3.2` + `block2 0.6.2` stack already pinned at the workspace
# level. We declare the minimal feature set at the workspace
# level (so `cargo add` / `cargo update` see the right defaults
# and we don't pull `objc2-app-kit` transitively — see the
# per-crate deps for the rationale). Callers can opt out via
# `default-features = false` at the per-crate layer.
objc2-event-kit = { version = "0.3.2", default-features = false, features = [
    "EKCalendar",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKParticipant",
    "EKTypes",
] }
# Windows microphone permission detection via the WinRT
# `Windows.Security.Authorization.AppCapabilityAccess` API
# (see src-tauri/src/voice/windows.rs). `windows 0.61` is the
# series that ships the typed `AppCapability::Create` +
# `AppCapability::CheckAccess` surface; we don't pull the
# `Media_Capture_Capture` feature (heavier) because the
# `AppCapability` route is hardware-agnostic — it just reads
# the OS's per-app consent record. Pinned at the workspace
# level so the `windows` + `windows-core` + `windows-targets`
# trio resolves to one version across the lockfile.
windows = { version = "0.62.2", default-features = false, features = [
    "Security_Authorization_AppCapabilityAccess",
    "Foundation",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# The collector builds musl-static for the VPS so it has zero runtime deps.
# Tauri's release profile stays the default (the .app bundles glibc dynamically).
