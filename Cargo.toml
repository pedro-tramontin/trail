[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/trail-collector",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
authors = ["Pedro Tramontin <pedro@example.com>"]
repository = ""  # Filled in once repo URL is known

[workspace.dependencies]
# Shared deps — pinned once at the workspace level.
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-build = { version = "2.0", features = [] }
tauri-plugin-os = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ssh2 = "0.9"
async-trait = "0.1"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "getrandom"] }
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
zeroize = { version = "1", features = ["derive"] }
walkdir = "2"
tempfile = "3"
icalendar = "0.7"
tokio-cron-scheduler = "0.13"
# Phase 3 — summarizer + anonymizer + scheduler notifications.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
notify-rust = "4"
humantime = "2"
# HTTP mock server for the ollama client unit tests (no live ollama needed).
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# The collector builds musl-static for the VPS so it has zero runtime deps.
# Tauri's release profile stays the default (the .app bundles glibc dynamically).
