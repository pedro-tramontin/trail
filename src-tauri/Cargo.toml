[package]
name = "trail"
# Per-crate inline version (not `version.workspace = true`) per talon
# issue #2111: release-please bumps workspace-member versions by walking
# `extraFiles` in release-please-config.json, and only handles inline
# versions — `version.workspace = true` is invisible to that walker.
# The workspace root + each member's `[package].version` are kept in
# lockstep manually; release-please rewrites both on every release.
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
description = "Passive workday capture and VPS push. Tauri 2 menu-bar app."
license.workspace = true
repository.workspace = true

[lib]
name = "trail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Use workspace-pinned versions.
tauri = { workspace = true }
tauri-plugin-os = { workspace = true }
# Phase 7 §7.5 — CLI argv parsing for the `--demo` first-run flag.
# Already workspace-pinned; the derive feature is enabled in the
# workspace `[workspace.dependencies]` entry.
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ssh2 = { workspace = true }
async-trait = { workspace = true }
ssh-key = { workspace = true }
keyring = { workspace = true }
zeroize = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# Client-side pre-push validation. Same crate + same Draft flag as
# the collector (crates/trail-collector/src/validate.rs); both sides
# validate against the same bundled schema bytes.
jsonschema = { workspace = true }
tokio-cron-scheduler = { workspace = true }
# Phase 3 deps — `regex` / `once_cell` are workspace-inheriting
# (pinned once in the root `Cargo.toml`); `reqwest` is pinned
# locally because it needs the `default-features = false` +
# `rustls-tls` feature set that the workspace definition doesn't
# carry. `notify-rust` / `humantime` are tiny, infrequently-updated
# crates and are pinned locally for the same reason.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = { workspace = true }
once_cell = { workspace = true }
notify-rust = "4.18.0"
humantime = "2.4.0"
# Phase 5 §5.1 — whisper model download verification.
sha2 = { workspace = true }
# whisper-rs's GPU backends are activated per-target below (the
# always-on declaration has no features; the per-target
# `[target.'cfg(...)'.dependencies]` blocks pick the right one).
# See the workspace `Cargo.toml`'s whisper-rs comment for the
# per-OS rationale (cuda is omitted; metal is macOS-only;
# vulkan works on Linux + Windows without a build-time SDK).
whisper-rs = { workspace = true }
hound = { workspace = true }
dirs = { workspace = true }
# Phase 5 §5.2 — rubato is the cross-platform sinc resampler that takes the
# mic's native-rate f32 frames and produces 16 kHz mono for whisper. It is
# always built so the resampler tests can run on Linux CI.
rubato = { workspace = true }
# Phase 5 §5.4 — `tokio_util::sync::CancellationToken` for clean shutdown
# of the tray-icon blink loop spawned by `BlinkLoop::spawn`.
tokio-util = { workspace = true }
# Phase 5 §5.5 — parking_lot::Mutex guards the lazy whisper context,
# uuid::v4 generates entry_ids for voice store writes.
parking_lot = { workspace = true }
uuid = { workspace = true }
# Phase 6 §6.1 — the onboarding scan uses `walkdir` to check whether
# a VS Code extensions folder contains any `package.json` (real
# extensions nest it at `<ext>/<version>/package.json`, so a flat
# read_dir wouldn't suffice). The collector crate already pulls it
# in transitively, but a workspace dep keeps the bound explicit.
walkdir = { workspace = true }
# cpal pulls in the platform audio backend (CoreAudio on macOS,
# ALSA on Linux, WASAPI on Windows) selected at runtime — it is a
# cross-platform crate. Previously macOS-gated by mistake; now
# built on every target so the `voice::capture::backend` module
# has a single, consistent build path.
cpal = { workspace = true }
# global-hotkey selects Carbon on macOS, X11 on Linux, and Win32
# on Windows at runtime — also cross-platform. Previously
# macOS-gated by mistake; the Linux/Win32 backends are real and
# exercised on their respective platforms.
global-hotkey = { workspace = true }
# 2026-08-16 (ECD-3) — rusqlite for the Thunderbird calendar
# detector. Same crate + same `bundled` feature as the
# trail-collector browser-history module; we need a read-only
# sqlite open to sanity-check each `cache.sqlite` under
# `~/.thunderbird/<profile>/calendar-data/cache/<cal_id>/` so
# we don't report half-written caches as detections. The
# workspace pin already declares the right feature set; we
# re-declare it here for explicitness (per the same
# `default-features` rationale as `reqwest` above — Cargo
# otherwise warns that the per-crate `default-features` is
# "ignored").
rusqlite = { workspace = true }

# Phase 5 §5.7 — macOS mic permission detection. `objc2` is the
# modern safe wrapper around the Objective-C runtime (replacing
# `objc`/`cocoa`); `block2` provides the `__block` closures that
# Apple's AVFoundation completion-handler APIs require. All three
# stay gated to `cfg(target_os = "macos")` because they transitively
# link CoreFoundation — the non-macOS branch in
# `voice/permission.rs` returns `MicPermissionState::Undetermined`
# directly. The `objc2-event-kit` binding for macOS EventKit lives
# here too (same Apple-only link surface).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
block2 = { workspace = true }
# 2026-08-11 — macOS EventKit for the calendar collector. The
# `objc2-event-kit` 0.3.x series pairs with `objc2 0.6.4`. The
# minimal feature set (`EKEvent` / `EKEventStore` / `EKObject` /
# `EKTypes`) keeps us off `objc2-app-kit` (which would force
# AppKit on the collector subprocess) and is the surface the
# calendar reader needs. The workspace dep already declares
# `default-features = false`; we re-declare it here for
# explicitness — Cargo would otherwise warn that the per-crate
# `default-features` is "ignored" because the workspace version
# already provides one.
objc2-event-kit = { workspace = true }
# 2026-08-13 (D2) — whisper-rs on macOS enables the `metal`
# feature so whisper.cpp's GPU decode path links the Apple
# Metal framework. `cuda` + `vulkan` are intentionally omitted
# (see workspace Cargo.toml §5b D1/D2 for rationale); Metal
# alone is the recommended GPU path on macOS.
whisper-rs = { workspace = true, features = ["metal"] }

# Wayland + zbus are pre-emptive deps for the multi-backend hotkey
# work planned for the next release. Adding them now (as Linux-only)
# keeps the next PR scoped to just the dispatcher + backends rather
# than a Cargo.lock churn on top of the code change. `zbus` is the
# async IPC binding the dispatcher needs to talk to compositor
# services (e.g. GNOME's mutter portal); `wayland-client` is the
# raw binding; `wayland-protocols` with the `client` feature (which
# pulls in `wayland-client`) and the `staging` feature (which exposes
# the wlr-global-shortcuts, xdg-shell, and wlr-layer-shell protocols
# we need for compositor-specific hotkey backends) covers the
# surface the dispatcher will dispatch to.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "staging"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
# 2026-08-13 (D2) — whisper-rs on Linux enables no GPU features
# (§5b D3: Vulkan SDK + glslc headers are not installed on the
# build host, so `vulkan` would fail to configure; CUDA is
# omitted per §5b D1; Metal is macOS-only per §5b D2). The
# `enable_gpu` parameter in `WhisperContext::load` still
# defaults to `true` via `Config.voice.gpu_acceleration`, and
# the runtime probe records `gpu_active = false` when the GPU
# path isn't compiled in — the auto-fallback to CPU still
# works. CI runners don't have the Vulkan SDK either, so this
# stays consistent across the matrix. NVIDIA + AMD + Intel
# users get GPU decode via a future `vulkan` feature once the
# GitHub Actions runners install `libvulkan-dev` +
# `glslang-tools` (tracked as a follow-up).
whisper-rs = { workspace = true }

# Windows-only deps: the `windows` crate is the WinRT binding
# the §17-5 mic permission module uses to call
# `AppCapability::Create` + `CheckAccess`. `default-features = false`
# is required so we don't drag in the full Win32 surface
# (the foundation surface is enough — we only need the
# Security.Authorization.AppCapabilityAccess API + the HSTRING
# / IAsyncOperation plumbing from Foundation). The
# `windows-rs` runtime crate is implicit via the `windows`
# umbrella; no extra entry needed.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
# 2026-08-13 (D2) — whisper-rs on Windows enables no GPU
# features (§5b D3: the Vulkan SDK would need to be installed
# on the GitHub Actions runner; CUDA is omitted per §5b D1;
# Metal is macOS-only per §5b D2). The `enable_gpu` parameter
# in `WhisperContext::load` still defaults to `true` via
# `Config.voice.gpu_acceleration`, and the runtime probe
# records `gpu_active = false` when the GPU path isn't
# compiled in — the auto-fallback to CPU still works. DX12 +
# DirectML paths are added back in a follow-up once the
# Windows runner installs the Vulkan SDK.
whisper-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# HTTP mock server for the ollama client unit tests — see src/ollama.rs.
wiremock = { workspace = true }
# Phase 3 §3.5 — the scheduler uses `tokio::time::pause()` + `advance()`
# in its `spawn_loop_fires_within_5_second_tolerance` test, both of
# which live behind the `test-util` feature (the workspace `tokio`
# dep is `full`, which does not include `test-util`).
tokio = { workspace = true, features = ["test-util"] }
# Phase 9 §9.1 — the `start_collectors_with_config_spawns_scheduler`
# unit test installs a `MakeWriter` shim to capture the canonical
# "collector scheduler started" log line. The workspace
# `tracing-subscriber` is already pinned (used transitively by several
# crates); declaring it explicitly here keeps the dependency surface
# honest.
tracing-subscriber = { workspace = true }
# Phase 9 §9.1 — install-wizard dry-run fixture. The
# `mock-ssh-server` binary lives at `tests/fixtures/mock-ssh-server/`
# (a workspace member) and is spawned by the
# `install_vps_collector_dry_run_succeeds_against_mock_ssh` test
# on an ephemeral port. Gated to `cfg(test)` so the production
# Tauri binary never carries the fixture.
mock-ssh-server = { path = "../tests/fixtures/mock-ssh-server" }
# Phase 9 §9.1 — the integration test in `tests/headless_launch.rs`
# uses `tauri::test::mock_builder` + `mock_app` to spin up a fake
# Tauri runtime with no webview. The `test` feature is gated here
# (dev-only) so the production binary doesn't drag in the
# `mock_runtime` + test helpers at compile time.
tauri = { workspace = true, features = ["test"] }
# The integration test under `tests/` references `trail_lib::*`; the
# `package.lib.name = "trail_lib"` rename in `Cargo.toml` plus
# Cargo's auto-discovery of the host crate under `[dev-dependencies]`
# would create a self-reference cycle. We don't need an explicit
# self-dep — `tests/*.rs` in this crate see `trail_lib::*` through
# Cargo's normal crate-as-test-target plumbing.
