[package]
name = "trail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Passive workday capture and VPS push. Tauri 2 menu-bar app."
license.workspace = true
repository.workspace = true

[lib]
name = "trail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Use workspace-pinned versions.
tauri = { workspace = true }
tauri-plugin-os = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ssh2 = { workspace = true }
async-trait = { workspace = true }
ssh-key = { workspace = true }
keyring = { workspace = true }
zeroize = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# Client-side pre-push validation. Same crate + same Draft flag as
# the collector (crates/trail-collector/src/validate.rs); both sides
# validate against the same bundled schema bytes.
jsonschema = { workspace = true }
tokio-cron-scheduler = { workspace = true }
# Phase 3 deps — explicit pinned versions (not workspace-inheriting) so
# release-please v4 can rewrite them later without touching every consumer.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = { workspace = true }
once_cell = { workspace = true }
notify-rust = "4"
humantime = "2"

[dev-dependencies]
tempfile = { workspace = true }
# HTTP mock server for the ollama client unit tests — see src/ollama.rs.
wiremock = { workspace = true }
