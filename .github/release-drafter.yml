# release-drafter configuration
#
# Trail's release pipeline (Phase 8 §8.2): release-drafter reads merged
# PR titles and decides the next version + drafts the changelog body.
# The next version is computed as a single cumulative bump from the
# latest published release (not a per-PR bump). The draft accumulates
# PRs in its body until the user merges the
# `chore(release): bump version to vX.Y.Z` PR that version-bump.yml
# opens. promote.yml then builds prod binaries, attaches them to the
# (still draft) release, and flips the draft → published.
#
# release-drafter emits ONE draft release per push to main. The
# tag prefix is `trail-v` (src-tauri is the primary component). The
# `crates/trail-collector` version is bumped in lockstep with
# src-tauri (per the user's standing rule: "Tauri and cargo can
# follow the same versions for now"), so a single `trail-vX.Y.Z`
# release covers both.
#
# Version-resolver (PR title prefix is the source of truth):
#   feat!:/fix!:/refactor!: → major
#   feat:                    → minor
#   fix:                     → patch
#   chore:/docs:/ci:/test:/build:/refactor:/perf:/style: → no bump
#
# Categorization (Keep a Changelog section names):
#   feat:             → "Added"
#   feat!:/refactor!: → "Changed"
#   fix:              → "Fixed"
#   chore:/docs:/ci:/test:/build:/perf:/style: → omit (not user-facing)
#
# Implementation note (v6 schema):
# We use the v6 `when: conventional:` filter shape (see
# https://github.com/release-drafter/release-drafter/blob/master/.github/release-drafter.yml)
# instead of the legacy `keywords:` + `version-resolver` blocks. v6
# requires every named category to have a `when:` filter (an empty
# category with no `when:` and no `label:` is rejected at config
# validation with "Multiple categories detected with no labels").
# The `exclusive: true` flag means a PR matching this category's
# conventional prefix is bucketed here and not re-evaluated against
# later categories — so `feat!:` doesn't accidentally also match
# `feat:`.
#
# v0.3.55 history: the original config (Phase 8 §8.2 #102) used the
# legacy `keywords:` shape and shipped an empty `category-defaults`
# block as a "drop uncategorized PRs" fallback. That tripped the v6
# schema validator ("Only one category with no labels is supported
# for uncategorized pull requests") and the workflow failed at parse
# time. The smoke test on #103 caught this — release-drafter run
# 30880664416 failed with `Error: Invalid config file`. Fixed by
# porting to the v6 `when: conventional:` shape and dropping the
# category-defaults (v6 drops uncategorized PRs by default when no
# `category-defaults` is defined, which is what we want for the
# chore:/docs:/ci:/test:/build:/perf:/style: prefixes).

name-template: "trail-v$RESOLVED_VERSION"
tag-template: "trail-v$RESOLVED_VERSION"

categories:
  - title: "Changed"
    semver-increment: "major"
    exclusive: true
    when:
      conventional:
        breaking: true
  - title: "Added"
    semver-increment: "minor"
    exclusive: true
    when:
      conventional:
        type: "feat"
  - title: "Fixed"
    semver-increment: "patch"
    exclusive: true
    when:
      conventional:
        type: "fix"

change-template: "- $TITLE (#$NUMBER) — `$COMMIT_SHA`"
no-changes-template: "- No changes"

template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/pedro-tramontin/trail/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

exclude-labels:
  - "skip-changelog"
  - "autorelease: pending"
