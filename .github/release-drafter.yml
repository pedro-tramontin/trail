# release-drafter configuration
#
# Trail's release pipeline (Phase 8 §8.2): release-drafter reads merged
# PR titles and decides the next version + drafts the changelog body.
# The next version is computed as a single cumulative bump from the
# latest published release (not a per-PR bump). The draft accumulates
# PRs in its body until the user merges the
# `chore(release): bump version to vX.Y.Z` PR that version-bump.yml
# opens. promote.yml then builds prod binaries, attaches them to the
# (still draft) release, and flips the draft -> published.
#
# release-drafter emits ONE draft release per push to main. The
# tag prefix is `trail-v` (src-tauri is the primary component). The
# `crates/trail-collector` version is bumped in lockstep with
# src-tauri (per the user's standing rule: "Tauri and cargo can
# follow the same versions for now"), so a single `trail-vX.Y.Z`
# release covers both.
#
# Version-resolver (PR labels, applied by labeler.yml from title
# prefix; the title itself remains the source of truth for humans):
#   type: breaking -> major
#   type: feature  -> minor
#   type: bug, type: refactor, type: perf, type: docs, type: chore,
#   type: ci, type: test, type: build, type: style -> patch
#   (a label is required; the pr-label-check job in draft-build.yml
#   enforces this)
#
# Categorization (Keep a Changelog section names):
#   type: feature  -> "Added"
#   type: breaking -> "Changed"
#   type: bug      -> "Fixed"
#   everything else (refactor, perf, docs, chore, ci, test, build,
#   style) -> not user-facing, dropped from the changelog body
#
# v0.3.56 history: release-drafter v6 is label-based only. The v0.3.55
# config used title-prefix `keywords:` + a custom `version-resolver`
# block, which v6 silently dropped (the Joi schema for `category` is
# `{title, label(s), collapse-after}` only -- no `keywords`, no
# `when:`, no `semver-increment`). The v0.3.55 config tripped the v6
# schema validator with "Multiple categories detected with no labels"
# because every category had `labels: []` and v6 only allows one such
# no-label category. Fixed in #105 by porting to the v6 label-based
# shape, with the labels supplied by the new `labeler.yml` workflow
# that maps Conventional Commits title prefixes to `type: <name>`
# labels at PR-open time.
#
# Implementation note: each category has exactly one label, the
# `version-resolver` keys on the same labels, and labels are
# auto-applied (never manually assigned) by labeler.yml from
# .github/label-rules.json. The label taxonomy is the contract
# between this file, labeler.yml, and the pr-label-check job in
# draft-build.yml.

name-template: "trail-v$RESOLVED_VERSION"
tag-template: "trail-v$RESOLVED_VERSION"

categories:
  - title: "Changed"
    label: "type: breaking"
  - title: "Added"
    label: "type: feature"
  - title: "Fixed"
    label: "type: bug"

version-resolver:
  major:
    labels:
      - "type: breaking"
  minor:
    labels:
      - "type: feature"
  patch:
    labels:
      - "type: bug"
      - "type: refactor"
      - "type: perf"
      - "type: docs"
      - "type: chore"
      - "type: ci"
      - "type: test"
      - "type: build"
      - "type: style"
  default: patch

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
no-changes-template: "- No changes"

template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/pedro-tramontin/trail/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

exclude-labels:
  - "skip-changelog"
  - "autorelease: pending"
