# Per-PR + per-pre-release-tag draft build workflow.
#
# This workflow has two trigger modes that produce DIFFERENT output
# destinations:
#
#   1. PR mode (PR opened/synchronized against main): uploads
#      unsigned debug bundles for all 3 platforms to the
#      **Actions run summary** as workflow artifacts. Used by
#      reviewers (and the author) to smoke-test the binary in
#      isolation, e.g. on a HostMyApple macOS VM, before the
#      official release lands. Does NOT touch GitHub Releases.
#
#   2. Pre-release tag mode (`trail-v*-pre.*` tag pushed by
#      release-please): uploads the same unsigned debug bundles
#      to the **GitHub pre-release page** that release-please
#      just created (the one with the "Pre-release" badge).
#      Talon pattern: every `feat:`/`fix:` PR merge produces a
#      `-pre.N` tag + pre-release page, and this workflow
#      attaches the debug binaries to it so anyone with the URL
#      can download + smoke-test before the stable release.
#
# The two modes are mutually exclusive at the job level: each
# of the 6 jobs (3 PR-review + 3 pre-release-attach) has an
# `if:` filter on `github.event_name` so only the relevant
# mode runs for the current trigger.
#
# Why unsigned: signing requires APPLE_CERTIFICATE_BASE64 + the
# private key in the Apple keychain, which is a per-fork secret.
# Forks do NOT have access to the upstream repo's secrets, by
# design (prevents PR-submitted code from getting secret-bearing
# builds). The unsigned-draft is fine for "does it compile + bundle
# + the UI launches" QA. The stable release.yml produces signed
# + notarized binaries for the published release.
#
# Why two sets of three jobs (6 total), not one matrix: the upload
# destinations are different (Actions artifacts vs. GitHub
# Releases) and the tooling differs (actions/upload-artifact@v4
# vs. tauri-action@v0). A single job trying to do both would
# need conditional step logic that is harder to reason about
# than separate jobs. Six jobs also matches Talon's pattern
# (Talon has 3 tag-triggered jobs that build+attach in one step
# via tauri-action; Trail has 3 PR-triggered review jobs +
# 3 tag-triggered attach jobs because we want both PR smoke
# testing AND pre-release attachments).
#
# What `pnpm tauri build --debug` actually produces per platform
# (Tauri 2.x canonical paths — note the trail Cargo workspace
# has its root at the repo root, so `target/` lives at the repo
# root, NOT at `src-tauri/target/`):
#   - Linux:   target/debug/bundle/deb/*.deb
#              + target/debug/bundle/appimage/*.AppImage
#              + the raw binary at target/debug/trail
#   - macOS:   target/aarch64-apple-darwin/debug/bundle/macos/Trail.app
#              + target/aarch64-apple-darwin/debug/bundle/dmg/*.dmg
#              (the path includes the target triple because
#              we pass `--target aarch64-apple-darwin`; without
#              --target the path would be `target/debug/...`
#              like Linux/Windows)
#   - Windows: target/debug/bundle/msi/*.msi
#              + target/debug/bundle/nsis/*.exe
#              + the raw binary at target/debug/trail.exe
#
# Why --debug not release: debug builds skip LTO + codesign +
# notarization + universal-binary merge, dropping build time
# from ~10 min (release on macos-latest) to ~3-4 min. The
# produced binary is functionally equivalent for smoke-testing:
# the same Rust code, the same Svelte bundle, the same Tauri
# 2 runtime. The only difference is binary size and (for macOS)
# the absence of codesign on the .app. Per the
# tests/MACOS_PHASE5_CHECKLIST.md trail-voice permission flow
# the TCC prompt fires on the bundle id, which is identical
# between debug and release.

name: draft-build

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'trail-v*-pre.*'
  workflow_dispatch:

# Fork guard applied per-job below — the GH Actions schema
# rejects `if:` at the workflow top level.

permissions:
  contents: read

jobs:
  # ===================================================================
  # Linux draft build (.deb + AppImage + raw binary)
  # ===================================================================
  draft-linux:
    # Linux runner — what the headless CI host uses. The artifact
    # is a `tauri build --debug` output so reviewers can smoke-test
    # the binary on a Linux VM without needing macOS hardware.
    # Only runs in PR-review mode (workflow_dispatch + tag push are
    # handled by the attach-linux job below).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      # Per-step fork guard: forks checking out untrusted SHA pulls
      # code into a context where secrets are not exposed — skip them
      # so a fork PR does not consume runner minutes.
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      # Tauri 2 Linux build prereqs. The collect crate is pure-Rust musl
      # with no system deps, but `pnpm tauri build` (the main app) pulls
      # webkit2gtk-4.1 which transitively requires the GTK/glib stack.
      # The list mirrors Tauri's docs: https://v2.tauri.app/start/prerequisites/
      - name: Install Linux system deps (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Swatinem/rust-cache caches Cargo registry + target/ between
      # runs. The `shared-key` scopes the cache to draft-linux so
      # it doesn't collide with release.yml's `trail-release-linux`
      # cache (different keys = different buckets, which is the
      # intent: a PR's draft build shouldn't be invalidated by
      # a release merge or vice versa). Same pattern as release.yml
      # but with `trail-draft-linux` as the key.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-draft-linux

      - name: Install pnpm
        # Pin pnpm to the version the project uses (lockfileVersion 9.x
        # in pnpm-lock.yaml); `pnpm@latest` pulled 11.18.0 which
        # requires Node 22.13+ AND the node:sqlite builtin, breaking
        # the previous Node-20 pin. MUST run BEFORE the
        # `actions/setup-node@v4` step with `cache: pnpm` below —
        # setup-node looks up `pnpm` on PATH to discover the store
        # directory, and fails with "Unable to locate executable
        # file: pnpm" if pnpm isn't on PATH yet. release.yml uses
        # the same order (pnpm/action-setup first, then setup-node).
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          # pnpm 11+ requires Node.js 22.13+ (calls node:sqlite builtin).
          # Pin to 22 LTS to match pnpm@10.18.0 (the project's lockfile
          # version). Bump to 24 if the lockfile moves to pnpm 11.
          # `cache: pnpm` configures the pnpm store as a cache target
          # — pnpm MUST already be installed (above step) or this
          # fails with "Unable to locate executable file: pnpm".
          node-version: "22"
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri debug bundle (Linux)
        # `tauri build --debug` produces an unsigned, un-stripped
        # binary in src-tauri/target/debug/bundle/ — enough for
        # reviewers to run `--help` / `--health` and confirm the
        # build wires up.
        run: pnpm tauri build --debug

      - name: Upload Linux draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: trail-draft-linux-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          # The trail Cargo workspace has its root at the repo
          # root (Cargo.toml lives there), so Cargo's `target/`
          # is at the repo root, NOT at src-tauri/target/. Tauri
          # 2 respects this and writes the bundle under
          # `<repo>/target/debug/bundle/{deb,appimage}/`. The
          # original draft-build.yml had `src-tauri/target/...`
          # in this path, which is wrong for a workspace with the
          # root at the repo top-level — uploads silently
          # produced zero artifacts because of `if-no-files-found:
          # warn`. The fix is to drop the `src-tauri/` prefix.
          # Verified on PR #88 (run 30811406261): the tauri build
          # log reports the bundles at
          # /home/runner/work/trail/trail/target/debug/bundle/deb/
          # and the upload step with `src-tauri/target/...` in
          # the path warned "No files were found" — exactly this
          # bug.
          path: |
            target/debug/trail
            target/debug/bundle/**/*.deb
            target/debug/bundle/**/*.AppImage
          if-no-files-found: error

  # ===================================================================
  # macOS draft build (unsigned .app + .dmg)
  # ===================================================================
  draft-macos:
    # macos-14 is the Apple-silicon runner image — matches the
    # release.yml's `targets: aarch64-apple-darwin`. Avoids the
    # universal-binary build cost (~2x) for the draft.
    # Only runs in PR-review mode (tag push is handled by the
    # attach-macos job below).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-draft-mac

      - name: Install pnpm
        # MUST run BEFORE setup-node — see the draft-linux job's
        # pnpm/action-setup comment for the full explanation.
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # CRITICAL: the release.yml sets `signingIdentity` to
      # `"${APPLE_SIGNING_IDENTITY}"` (a template that resolves to
      # the literal string `${APPLE_SIGNING_IDENTITY}` on draft
      # builds because the Apple secrets are not exposed to PRs,
      # and Tauri's env-var substitution requires the var to be
      # `export`ed, not just present in `$GITHUB_ENV`). The literal
      # placeholder string fails `codesign --sign` with
      # `no identity found`. The fix is the same one release.yml
      # uses (lines 204-229): set `signingIdentity` to `null`
      # (not `""`) — Tauri 2 treats an empty string as "use the
      # default keychain identity" and runs codesign anyway (which
      # fails on a runner with no keychain identities), while
      # `null` is the documented "do not sign" sentinel and skips
      # the codesign step entirely. This is always correct for a
      # draft build — PRs never get the Apple secrets, so codesign
      # must always be disabled here.
      - name: Disable codesign for unsigned draft build
        run: |
          sed -i.bak \
            's|"signingIdentity": "${APPLE_SIGNING_IDENTITY}"|"signingIdentity": null|' \
            src-tauri/tauri.conf.json
          rm src-tauri/tauri.conf.json.bak
          grep -A1 signingIdentity src-tauri/tauri.conf.json

      - name: Build Tauri debug bundle (macOS, aarch64)
        # `--target aarch64-apple-darwin` keeps the build
        # single-arch for the draft — the release.yml does the
        # universal binary merge separately. `--debug` skips
        # LTO + the universal-merge step.
        run: pnpm tauri build --debug --target aarch64-apple-darwin

      - name: Upload macOS draft artifact
        uses: actions/upload-artifact@v4
        with:
          # The .app bundle is the unit on macOS — Gatekeeper,
          # `open`, and the Finder all expect a directory named
          # `*.app`, not a binary. The path includes the target
          # triple (`aarch64-apple-darwin`) because we passed
          # `--target aarch64-apple-darwin` above — when a
          # target is specified, Cargo (and therefore Tauri)
          # puts the build under `<workspace>/target/<triple>/`.
          # Since trail's Cargo workspace root is the repo
          # root, the path is `target/aarch64-apple-darwin/...`
          # (no `src-tauri/` prefix). Verified on PR #88 (run
          # 30811406261): the build reports the bundle at
          # /Users/runner/work/trail/trail/target/aarch64-apple-darwin/debug/bundle/macos/Trail.app
          # and the upload with `src-tauri/target/...` warned
          # "No files were found". The .dmg is a nice-to-have;
          # unsigned .dmg builds can fail if the .app's
          # permissions are weird, so it's optional (warn if
          # missing) once the .app is uploaded successfully.
          name: trail-draft-macos-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/aarch64-apple-darwin/debug/bundle/macos/Trail.app
            target/aarch64-apple-darwin/debug/bundle/dmg/*.dmg
          if-no-files-found: error

  # ===================================================================
  # Windows draft build (unsigned .msi + .exe)
  # ===================================================================
  draft-windows:
    # windows-latest matches release.yml's choice. As of 2026-08
    # this is windows-2022; GitHub rolls the "latest" label
    # forward periodically but the toolchain (VS 2022, Rust msvc,
    # NSIS 3.x) is the same across recent images.
    # Only runs in PR-review mode (tag push is handled by the
    # attach-windows job below).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - name: Setup Rust toolchain (msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          # The Tauri 2 Windows toolchain needs the MSVC target
          # explicitly — the default `stable` toolchain is `gnu`
          # on windows-latest and Tauri can't link WebView2
          # against the gnu toolchain. `msvc` matches what
          # release.yml's build-windows job uses.
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-draft-windows

      - name: Install pnpm
        # MUST run BEFORE setup-node — see the draft-linux job's
        # pnpm/action-setup comment for the full explanation.
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri debug bundle (Windows, x64)
        # `pnpm tauri build --debug` on Windows auto-downloads
        # NSIS 3.x via Tauri's bundle pipeline (no manual
        # install step needed). The output paths are
        # `bundle/msi/*.msi` + `bundle/nsis/*.exe` + the raw
        # `target/debug/trail.exe`.
        run: pnpm tauri build --debug

      - name: Upload Windows draft artifact
        uses: actions/upload-artifact@v4
        with:
          # Same fix as draft-linux / draft-macos: the trail
          # Cargo workspace has its root at the repo root, so
          # the build artifacts are under `target/`, not
          # `src-tauri/target/`. Verified on PR #88 (run
          # 30811406261): the build reported
          # /home/runner/work/trail/trail/target/debug/bundle/{msi,nsis}/
          # and the old `src-tauri/target/...` paths warned
          # "No files were found". Changed `if-no-files-found`
          # to `error` from `warn` so a future path regression
          # fails the build instead of silently uploading
          # nothing.
          name: trail-draft-windows-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/debug/trail.exe
            target/debug/bundle/**/*.msi
            target/debug/bundle/**/*.exe
          if-no-files-found: error

  # ===================================================================
  # Pre-release attach jobs (Talon pattern) — only run on
  # `trail-v*-pre.*` tag push. Each job builds the same debug bundle
  # as the matching draft-* job above, but uses `tauri-action@v0`
  # to attach the binary to the GitHub pre-release that
  # release-please just created.
  #
  # Why 3 separate jobs (not a matrix): matches the existing
  # draft-* design and Talon's pattern. Host runners diverge
  # (apt webkit2gtk on Linux, codesign template patch on macOS,
  # NSIS on Windows), so a matrix would obscure the failure
  # surface.
  #
  # The `if:` filter ensures these jobs only run for tag pushes.
  # On a PR push, github.event_name == 'pull_request' and these
  # jobs are skipped entirely (no runner time wasted).
  # ===================================================================
  attach-linux:
    # Linux tag-triggered build. Uses tauri-action to attach the
    # .deb + .AppImage to the pre-release page. release-please has
    # already created the pre-release + tag at this point; we
    # just attach the binaries.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/trail-v') && contains(github.ref, '-pre.')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # required by tauri-action to attach to release
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-draft-linux

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Build + attach Tauri debug bundle to pre-release (Linux)
        # tauri-action handles the full pipeline: build the bundle
        # in debug mode, then attach the resulting assets to the
        # GitHub pre-release that release-please just created.
        # `tagName: ${{ github.ref_name }}` is the trail-vX.Y.Z-pre.N
        # tag that fired this workflow. `releaseDraft: true` +
        # `prerelease: true` are safety nets — if for any reason
        # the pre-release doesn't exist when tauri-action runs
        # (e.g. release-please created the tag but failed to
        # create the release), tauri-action creates it as a
        # pre-release draft (not auto-published).
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Trail ${{ github.ref_name }}"
          releaseBody: "**Pre-release (debug build).** See [CHANGELOG.md](https://github.com/pedro-tramontin/trail/blob/${{ github.ref_name }}/CHANGELOG.md) for the full release notes."
          releaseDraft: true
          prerelease: true
          args: --debug --bundles deb,appimage

  attach-macos:
    # macOS tag-triggered build. Uses tauri-action to attach the
    # unsigned .app + .dmg to the pre-release page. The macOS
    # codesign template in tauri.conf.json is patched to null
    # before the build (mirrors the release.yml pattern) since
    # PRs/tags don't get the Apple signing secrets.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/trail-v') && contains(github.ref, '-pre.')
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-draft-mac

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # CRITICAL: the release.yml sets `signingIdentity` to
      # `"${APPLE_SIGNING_IDENTITY}"` (a template that resolves to
      # the literal string `${APPLE_SIGNING_IDENTITY}` on tag-triggered
      # runs because the Apple secrets are not exposed to this
      # workflow, and Tauri's env-var substitution requires the var
      # to be `export`ed, not just present in `$GITHUB_ENV`). The
      # literal placeholder string fails `codesign --sign` with
      # `no identity found`. The fix is the same one release.yml
      # uses: set `signingIdentity` to `null` (not `""`) — Tauri 2
      # treats an empty string as "use the default keychain
      # identity" and runs codesign anyway (which fails on a runner
      # with no keychain identities), while `null` is the documented
      # "do not sign" sentinel and skips the codesign step entirely.
      - name: Disable codesign for unsigned pre-release build
        run: |
          sed -i.bak \
            's|"signingIdentity": "${APPLE_SIGNING_IDENTITY}"|"signingIdentity": null|' \
            src-tauri/tauri.conf.json
          rm src-tauri/tauri.conf.json.bak
          grep -A1 signingIdentity src-tauri/tauri.conf.json

      - name: Build + attach Tauri debug bundle to pre-release (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Trail ${{ github.ref_name }}"
          releaseBody: "**Pre-release (debug build, unsigned macOS).** See [CHANGELOG.md](https://github.com/pedro-tramontin/trail/blob/${{ github.ref_name }}/CHANGELOG.md) for the full release notes."
          releaseDraft: true
          prerelease: true
          args: --debug --target aarch64-apple-darwin

  attach-windows:
    # Windows tag-triggered build. Uses tauri-action to attach
    # the .msi + .exe to the pre-release page.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/trail-v') && contains(github.ref, '-pre.')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain (msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-draft-windows

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Build + attach Tauri debug bundle to pre-release (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Trail ${{ github.ref_name }}"
          releaseBody: "**Pre-release (debug build).** See [CHANGELOG.md](https://github.com/pedro-tramontin/trail/blob/${{ github.ref_name }}/CHANGELOG.md) for the full release notes."
          releaseDraft: true
          prerelease: true
          args: --debug --bundles msi,nsis
