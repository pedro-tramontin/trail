# GitHub Actions workflow for Trail binary builds + asset attachment.
#
# Pattern (modeled on talon/.github/workflows/release.yml):
#   1. release-please workflow (release-please.yml) creates a DRAFT
#      GitHub Release + pushes the `trail-X.Y.Z` tag when its release
#      PR merges to main. See release-please.yml for the trigger.
#   2. This workflow fires on the tag push. Three parallel build jobs
#      (Linux / macOS / Windows) each use `tauri-apps/tauri-action@v0`
#      to build the bundle AND attach it to the existing draft
#      release in one step. tauri-action's `releaseDraft: true` flag
#      makes the FIRST build create the draft if it doesn't exist,
#      and subsequent builds attach to the same draft.
#   3. The `finalize` job (depends on all 3 build jobs) decides whether
#      to publish the draft as a production release or as a prerelease
#      based on the tag name:
#         trail-X.Y.Z          → publish as production (the default)
#         trail-X.Y.Z-rc.N     → publish as prerelease
#         trail-X.Y.Z-beta.N   → publish as prerelease
#         trail-X.Y.Z-*        → publish as prerelease (unknown suffix)
#      The user can still manually flip the published release back to
#      draft via the GitHub Releases UI if a mistake was made — but
#      the default is "auto-publish" so the artifact is reachable
#      without a manual click.
#
# Why this architecture (vs the previous all-in-one release.yml):
#   - The previous workflow mixed push-to-main + tag-push triggers in
#     one file, which made the `needs.<job>.outputs.tag_name` pattern
#     fragile (the v0.2.0 release shipped with 0 binary assets
#     because the release-please step's outputs didn't reach the
#     build jobs).
#   - Separating the workflows means release-please only runs on
#     push-to-main (it needs commit history to decide the next
#     version) and the build workflow only runs on tag-push (it
#     needs a real release to attach assets to). Each workflow
#     has one job, one trigger, one responsibility.
#   - tauri-action does build + upload in one step, replacing the
#     previous per-arch manual matrix + softprops upload-assets job.
#     This is fewer moving parts, fewer failure modes, and the
#     canonical Tauri 2 release pattern.
#
# Per-talon PR #62 pitfall (carried forward): NEVER use `if:` keys
# at job/step level to gate on env vars to check secret presence.
# GH Actions resolves `if:` before secrets are exposed, so
# `if: ${{ secrets.X }}` returns falsy even when the secret is
# set. Use bash guards inside `run:` blocks that check
# `[ -n "${VAR:-}" ]` instead. The macOS signing+notarization
# block below follows this pattern.

name: release

on:
  push:
    tags:
      - 'trail-v[0-9]+.[0-9]+.[0-9]+*'  # matches trail-X.Y.Z, trail-X.Y.Z-rc.N, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. trail-v0.2.0). Defaults to the latest tag.'
        required: false
        type: string

# Cancel in-flight builds for the same tag if a new commit is pushed
# to the tag (rare; mainly defensive against release-please re-pushing).
concurrency:
  # On tag-push, github.ref_name is the tag. On workflow_dispatch, github.ref_name is
  # the branch (usually main). The build jobs use env.TAG (which falls back to
  # inputs.tag for dispatch), but the concurrency group can only reference
  # built-in contexts. Using github.ref_name is fine — on workflow_dispatch, all
  # in-flight builds share the same group, which is the safe default.
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write  # required to attach assets to a release
  id-token: write  # required for OIDC-based notarization (item 7-2)
  pull-requests: read  # not used here, but matches the workflow-level
                        # permissions convention from release-please.yml

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # TAG falls back to the ref name (which is the tag on a tag-push
  # trigger) or to the explicit `inputs.tag` workflow_dispatch input.
  # Using ${{ }} inside `env:` is fine because env vars are
  # evaluated at runtime, not at workflow-receive time (unlike `if:`).
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ----- Linux build (.deb + AppImage) -----
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri 2 prereqs)
        # Same list as draft-build.yml + release.yml's previous fix.
        # webkit2gtk-4.1 transitively pulls glib, gtk-3, libsoup, etc.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev libglib2.0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-release-linux

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install UI deps + build
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build Tauri bundle (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Trail ${{ env.TAG }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/pedro-tramontin/trail/blob/${{ env.TAG }}/CHANGELOG.md) for the full release notes."
          releaseDraft: true
          prerelease: false
          # `--bundles` is forwarded to `cargo tauri build`. `deb` is
          # the primary Ubuntu/Debian artifact. `appimage` is the
          # portable Linux format that works across distros without
          # the user needing root.
          args: --bundles deb,appimage

  # ----- macOS build (universal .app + .dmg) -----
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only the native arch for now. GitHub's `macos-latest`
          # runners ship Apple Silicon (aarch64-apple-darwin).
          # Previously this job built `--target universal-apple-darwin`
          # which cross-compiled to x86_64, but the cross-compile
          # path runs into `libssh2-sys` -> `openssl-sys` build-script
          # failures (no host OpenSSL available for x86_64). We
          # can revisit x86_64 once the app has users who need it.
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-release-mac

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install UI deps + build
        run: pnpm install --frozen-lockfile && pnpm build

      # macOS codesign + notarization is OPTIONAL. The Tauri CLI reads
      # APPLE_CERTIFICATE from the env; an empty value skips the
      # import step entirely (the unsigned build succeeds, the
      # release ships as a downloadable .dmg without code signing).
      #
      # Per-talon PR #62 pitfall: never use top-level `if:` to gate
      # on secrets. Use bash guards instead. The env block on this
      # step is the "interop" point — bash decides whether to write
      # the signing secrets to $GITHUB_ENV for the tauri-action step
      # to inherit. When the secret is absent, the env var is
      # simply not set in the tauri-action process; tauri-action
      # sees var_os("APPLE_CERTIFICATE") == None and skips signing.
      - name: Propagate Apple signing secrets (no-op if APPLE_CERTIFICATE is absent)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Apple signing secrets detected — forwarding to tauri-action via \$GITHUB_ENV."
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            # tauri-action's `signingIdentity` input overrides the
            # tauri.conf.json value with whatever we pass here. With
            # cert present, use the real identity from the secret.
            echo "APPLE_SIGNING_IDENTITY_FOR_ACTION=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_CERTIFICATE not set; shipping unsigned .dmg"
            # Pin the tauri-action input explicitly to an empty
            # string so codesign is skipped entirely. The literal
            # string in tauri.conf.json resolves to the empty
            # string when APPLE_SIGNING_IDENTITY is unset.
            echo "APPLE_SIGNING_IDENTITY_FOR_ACTION=-" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri bundle (macOS aarch64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Trail ${{ env.TAG }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/pedro-tramontin/trail/blob/${{ env.TAG }}/CHANGELOG.md) for the full release notes."
          releaseDraft: true
          prerelease: false
          # `signingIdentity` overrides the value in tauri.conf.json
          # at build time. Set to the real identity when secrets are
          # present; set to `-` (tauri-action's "skip signing"
          # sentinel) when APPLE_CERTIFICATE is unset so codesign
          # doesn't run. Without this, the `${APPLE_SIGNING_IDENTITY}`
          # literal in tauri.conf.json survives when the env var is
          # unset and codesign rejects it as a non-existent identity.
          signingIdentity: ${{ env.APPLE_SIGNING_IDENTITY_FOR_ACTION }}
          # Native arch only (aarch64-apple-darwin). The previous
          # universal target cross-compiled to x86_64-apple-darwin
          # which broke the libssh2-sys -> openssl-sys build script
          # (no host OpenSSL for the cross target). See the dtolnay
          # setup step above for the corresponding target list.
          args: --target aarch64-apple-darwin

  # ----- Windows build (.exe installer via NSIS) -----
  # Tauri's `bundle.targets` includes `nsis` (Nullsoft Scriptable Install
  # System), which produces a single-file `.exe` installer that bundles
  # the .app + .runtime. Tauri 2 does NOT use WiX any more — the `nsis`
  # target only needs the `nsis` CLI on PATH, which is installed by
  # default on the windows-latest runner.
  #
  # The Voice crate is macOS-only (cpal + global-hotkey + objc2 / block2
  # are all `cfg(target_os = "macos")`-gated). The non-macOS branch in
  # `voice/permission.rs` returns `MicPermissionState::Undetermined`
  # directly, so the build will compile on Windows but the audio
  # capture will be a no-op. That's the documented trade-off and matches
  # the project's "Mac-first, ports as we go" position.
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-release-windows

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install UI deps + build
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build Tauri bundle (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Trail ${{ env.TAG }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/pedro-tramontin/trail/blob/${{ env.TAG }}/CHANGELOG.md) for the full release notes."
          releaseDraft: true
          prerelease: false
          # `--target x86_64-pc-windows-msvc` is the default Windows
          # target (Visual Studio C++ toolchain, preinstalled on the
          # windows-latest image). `--bundles nsis` tells Tauri's
          # bundler to produce a single .exe installer.
          args: --target x86_64-pc-windows-msvc --bundles nsis

  # ----- Finalize: publish draft as production or prerelease -----
  # The 3 build jobs above all set `releaseDraft: true`, so the first
  # to finish creates the draft, and the others attach their assets
  # to the same draft. When all build jobs finish, this job inspects
  # the tag name and decides whether to:
  #   - Publish as production (default for `trail-X.Y.Z`)
  #   - Publish as prerelease (for `trail-X.Y.Z-rc.N` / `-beta.N` / etc.)
  #   - Leave as draft (only if explicitly named `trail-X.Y.Z-draft`)
  #     — useful for testing the pipeline end-to-end without making
  #     a release visible to users
  finalize:
    name: Publish Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # required to flip draft → published / prerelease
    steps:
      - uses: actions/checkout@v4

      - name: Determine release type from tag
        id: classify
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ env.TAG }}
        run: |
          # Tag format: trail-X.Y.Z[-suffix]
          #   trail-X.Y.Z         → production
          #   trail-X.Y.Z-rc.N    → prerelease
          #   trail-X.Y.Z-beta.N  → prerelease
          #   trail-X.Y.Z-draft   → keep as draft (no auto-publish)
          #   trail-X.Y.Z-anything-else → prerelease (conservative)
          if [[ "$TAG" =~ ^trail-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_type=production" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false"     >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^trail-v[0-9]+\.[0-9]+\.[0-9]+-draft$ ]]; then
            echo "release_type=draft"     >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false"     >> "$GITHUB_OUTPUT"
          else
            # rc.N, beta.N, alpha.N, or unknown suffix → prerelease
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true"       >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG"                  >> "$GITHUB_OUTPUT"
          echo "::notice::Tag $TAG classified as ${{ steps.classify.outputs.release_type }}"

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ env.TAG }}
          IS_PRERELEASE: ${{ steps.classify.outputs.is_prerelease }}
          RELEASE_TYPE: ${{ steps.classify.outputs.release_type }}
        run: |
          if [ "$RELEASE_TYPE" = "draft" ]; then
            echo "Tag $TAG is marked as draft; leaving the release as a draft for manual review."
            gh release edit "$TAG" --draft=true || true
            exit 0
          fi
          echo "Publishing $TAG as $RELEASE_TYPE (prerelease=$IS_PRERELEASE)..."
          gh release edit "$TAG" \
            --draft=false \
            --prelease="$IS_PRERELEASE" \
            --discussion=false || {
              echo "::warning::gh release edit failed; release may need manual promotion"
              exit 1
            }
          echo "Release $TAG is now live as a $RELEASE_TYPE."

      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ env.TAG }}
          RELEASE_TYPE: ${{ steps.classify.outputs.release_type }}
        run: |
          echo "## Release $TAG finalized" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Type:** $RELEASE_TYPE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** https://github.com/pedro-tramontin/trail/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
