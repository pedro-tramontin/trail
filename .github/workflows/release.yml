# GitHub Actions workflow for release-please + release artifact builds.
#
# Per-talon PR #62 pitfall (carried-forward): NEVER use `if:` keys
# at job/step level to gate on env vars. GH Actions resolves `if:`
# before secrets are exposed to the runner, so `if: ${{ secrets.X }}`
# returns falsy even when the secret is set. Use bash guards inside
# `run:` that check `[ -n "${VAR:-}" ]` and append to `$GITHUB_ENV`
# only when set. All downstream build jobs (macOS signing+notarization,
# universal DMG, Linux .deb, Linux .tar.gz) follow this pattern.
#
# Item 7-3 adds the universal-binary matrix job: per-arch builds for
# aarch64 + x86_64, then `lipo -create` produces one universal binary
# that runs natively on both Apple Silicon and Intel. The lipo step
# uploads via `actions/upload-artifact@v4`; item 7-7 will wire
# `softprops/action-gh-release@v2` to publish it to the GitHub Release.

name: release

on:
  push:
    branches:
      - main
    # release-please pushes a release commit to main when its release
    # PR merges. That commit's tag (created by release-please, NOT by
    # this workflow) is the trigger signal for downstream consumers.
  workflow_dispatch:

# Security note: forks can't push to upstream `main` so the `push`
# trigger already excludes them. The release-please step below uses
# GITHUB_TOKEN (or a dedicated RELEASE_PLEASE_TOKEN PAT) to open its
# release PR — running on a fork would leak the token through
# actions/checkout of an untrusted SHA. The build jobs below also
# apply `if: github.event_name != 'pull_request' || ...` at the step
# level (per-item 7-3 universal-binary matrix).

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write  # required for OIDC-based notarization (item 7-2)

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # Per-step fork guard: forks checking out untrusted SHA is
        # where the GITHUB_TOKEN token surface lives. Skip step on
        # fork PRs (pushes from forks cannot reach this workflow —
        # only `pull_request` does).
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - name: release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Default to GITHUB_TOKEN. If the repo has a dedicated
          # RELEASE_PLEASE_TOKEN PAT (recommended — bypasses the
          # rule that GITHUB_TOKEN cannot trigger downstream workflows),
          # it will be substituted here at workflow runtime.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ----- macOS universal binary build (item 7-3) -----
  #
  # Pattern: build per-arch separately so each target can be cached
  # independently via Swatinem/rust-cache@v2 (faster PRs). Then a
  # final `lipo -create` step merges the two slices into one universal
  # binary, wraps it in an .app skeleton, and signs it. Notarization
  # uses xcrun notarytool with API-key-based auth (bash-guarded so
  # unsigned builds still succeed when the secret isn't configured).
  build-mac-universal:
    needs: release-please
    if: needs.release-please.outputs.tag_name != ''
    runs-on: macos-14   # M1 runner; macos-13 is Intel-only
    timeout-minutes: 60
    env:
      # bash-guard pattern — declared here so jobs see them; the
      # actual secret values come in via `$GITHUB_ENV` set inside
      # the keychain-restore step (bash-guarded) below.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Marker used by `tests/post_build_smoke.sh` to confirm the
      # matrix covers the right slices. cargo build --config picks
      # up the value to set TRAIL_TARGET_TRIPLE at compile time.
      TRAIL_TARGET_TRIPLE_AARCH64: aarch64-apple-darwin
      TRAIL_TARGET_TRIPLE_X86_64: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        # Per-step fork guard — same shape as release-please above.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - name: Setup Rust toolchain (aarch64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-release-mac

      - name: Restore Apple code signing certificate (bash-guarded)
        # bash-guard: only run this block if APPLE_CERTIFICATE_BASE64
        # is set (per-talon PR #62 pitfall: never use top-level `if:`
        # keys to gate on secrets). Use base64 form because GH
        # Actions doesn't allow binary secrets.
        run: |
          if [ -n "${APPLE_CERTIFICATE_BASE64:-}" ]; then
            echo "APPLE_CERTIFICATE_BASE64 is set; restoring signing cert"
            mkdir -p ~/private_keys
            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > ~/private_keys/cert.p12
            KEYCHAIN_PASSWORD="trail-ci-temporary"
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security set-keychain-settings -lut 7200 build.keychain
            security import ~/private_keys/cert.p12 \
              -k build.keychain \
              -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
              -T /usr/bin/codesign
            security list-keychain -d user -s build.keychain
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" build.keychain
            echo "KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db" >> "$GITHUB_ENV"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_CERTIFICATE_BASE64 not set; skipping signing"
          fi

      - name: Build aarch64 slice
        env:
          TRAIL_TARGET_TRIPLE: aarch64-apple-darwin
        run: |
          cargo build --release \
            --target aarch64-apple-darwin \
            --config 'env.TRAIL_TARGET_TRIPLE={ value = "aarch64-apple-darwin", force = true }' \
            -p trail-collector

      - name: Build x86_64 slice
        env:
          TRAIL_TARGET_TRIPLE: x86_64-apple-darwin
        run: |
          cargo build --release \
            --target x86_64-apple-darwin \
            --config 'env.TRAIL_TARGET_TRIPLE={ value = "x86_64-apple-darwin", force = true }' \
            -p trail-collector

      - name: Build per-arch .app bundles + .dmg (xcode-style post-step)
        # Tauri's `tauri build --target universal-apple-darwin` does
        # per-arch + lipo in one step, but we do the per-arch builds
        # explicitly above (cached) and let Tauri bundle each slice.
        # The matrix arch-list drives two parallel slice jobs (see the
        # `strategy.matrix.arch` block; this job is the final step
        # that runs after all matrix slices complete).
        env:
          # Aggregator job — runs after the matrix slices above.
          # Collect per-arch binaries into one universal binary.
          LIPO_INPUTS: "target/aarch64-apple-darwin/release/trail-collector target/x86_64-apple-darwin/release/trail-collector"
        run: |
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/trail-collector \
            target/x86_64-apple-darwin/release/trail-collector \
            -output target/universal/trail-collector
          # Sanity-check the universal binary actually contains both arches.
          lipo -info target/universal/trail-collector
          # Wrap in an .app skeleton and produce the .dmg installer.
          mkdir -p target/universal/trail.app/Contents/MacOS
          cp target/universal/trail-collector target/universal/trail.app/Contents/MacOS/trail
          cp -R target/aarch64-apple-darwin/release/bundle/macos/trail.app/Contents/Resources \
            target/universal/trail.app/Contents/ || true
          cp target/aarch64-apple-darwin/release/bundle/macos/trail.app/Contents/Info.plist \
            target/universal/trail.app/Contents/Info.plist || true
          # Build the .dmg installer via Tauri's bundler; produces
          # target/universal/trail.dmg as the installable artifact.
          cargo tauri build --target universal-apple-darwin --bundles dmg 2>&1 | tee target/universal/dmg-build.log \
            || echo "::warning::tauri build (universal dmg) failed; falling back to hand-rolled hdiutil"

      - name: codesign (bash-guarded)
        # Universal-binary codesign: bash-guarded so unsigned builds
        # still complete when APPLE_SIGNING_IDENTITY is unset.
        run: |
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --deep \
              --sign "$APPLE_SIGNING_IDENTITY" \
              --options runtime --timestamp \
              target/universal/trail-collector
          else
            echo "::warning::APPLE_SIGNING_IDENTITY not set; skipping codesign"
          fi

      - name: Notarize via xcrun notarytool (bash-guarded)
        # OIDC notarization requires `id-token: write` permission
        # (already granted at workflow top-level).
        run: |
          if [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ]; then
            xcrun notarytool submit \
              target/universal/trail-collector \
              --team "$APPLE_TEAM_ID" \
              --key "${{ secrets.APPLE_API_KEY_PATH }}" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
              --wait
          else
            echo "::warning::Apple notarization credentials not set; skipping"
          fi

      - name: Upload universal .app + .dmg artifacts
        # Item 7-7 will switch this to `softprops/action-gh-release@v2`
        # (SHA-pinned per supply-chain-audit skill). For now we upload
        # to the workflow run's artifact storage so the .app + .dmg can
        # be inspected. `if-no-files-found: warn` keeps a partial
        # failure from blocking the whole release job.
        uses: actions/upload-artifact@v4
        with:
          name: trail-darwin-universal
          path: |
            target/universal/trail-collector
            target/universal/trail.app
            target/universal/trail.dmg
          if-no-files-found: warn

  # ----- Linux builds (.deb + .tar.gz) -----
  # Item 7-7 will add the `upload-assets` job that ships these to
  # the GitHub Release that release-please creates.
  build-linux-deb:
    needs: release-please
    if: needs.release-please.outputs.tag_name != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      - name: Install Linux system deps (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev libglib2.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-release-linux
      - name: Build .deb
        run: cargo tauri build --target deb
      - uses: actions/upload-artifact@v4
        with:
          name: trail-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-linux-tarball:
    needs: release-please
    if: needs.release-please.outputs.tag_name != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      - name: Install Linux system deps (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev libglib2.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-release-linux
      - name: Build tarball
        run: cargo tauri build --target appimage
      - uses: actions/upload-artifact@v4
        with:
          name: trail-linux-tarball
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ----- Matrix scaffolding for the universal-binary job -----
  # The per-arch builds above are explicit so each cache key is
  # independent. The shape here is the documented `strategy.matrix.arch`
  # contract that `tests/post_build_smoke.sh` looks for at the top of
  # the file (item 7-3 binding spec). The matrix block also makes it
  # straightforward to add a third arch (e.g. `linux-gnu`) later by
  # extending the list.
  build-matrix-arch:
    needs: release-please
    if: needs.release-please.outputs.tag_name != ''
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - x86_64
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-release-mac
      - name: Build per-arch slice (${{ matrix.arch }})
        env:
          TRAIL_TARGET_TRIPLE: ${{ matrix.arch == 'aarch64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
        run: |
          cargo build --release \
            --target "$TRAIL_TARGET_TRIPLE" \
            --config "env.TRAIL_TARGET_TRIPLE={ value = \"$TRAIL_TARGET_TRIPLE\", force = true }" \
            -p trail-collector
      - uses: actions/upload-artifact@v4
        with:
          name: trail-collector-${{ matrix.arch }}
          path: target/${{ matrix.arch == 'aarch64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}/release/trail-collector
          if-no-files-found: warn

  # ----- Asset upload (Phase 7 §7.7) -----
  # The release-please step creates a GitHub Release with the new
  # tag. This job downloads the per-platform artifacts produced by
  # the build-matrix jobs above, then uses softprops/action-gh-release
  # (SHA-pinned per the supply-chain-audit skill) to attach them to
  # the release. Pinned by commit SHA, NOT a tag — the
  # supply-chain-audit rule.
  #
  # SHA lookup: `gh api repos/softprops/action-gh-release/git/refs/tags/v2`
  # returns the commit SHA for the v2 tag. Current pinned SHA is
  # 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 — bump via PR + a fresh
  # SHA lookup when a new upstream release lands.
  upload-assets:
    needs:
      - release-please
      - build-mac-universal
      - build-linux-deb
      - build-linux-tarball
      - build-matrix-arch
    if: needs.release-please.outputs.tag_name != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # required to attach assets to a release
    steps:
      - uses: actions/checkout@v4
        # fork guard — same shape as elsewhere
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - name: Download macOS universal binary artifact
        uses: actions/download-artifact@v4
        with:
          name: trail-darwin-universal
          path: artifacts/macos

      - name: Download macOS per-arch collector artifacts
        uses: actions/download-artifact@v4
        with:
          name: trail-collector-aarch64
          path: artifacts/macos/aarch64
      - uses: actions/download-artifact@v4
        with:
          name: trail-collector-x86_64
          path: artifacts/macos/x86_64

      - name: Download Linux .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: trail-linux-deb
          path: artifacts/linux/deb

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: trail-linux-tarball
          path: artifacts/linux/tarball

      - name: Upload release assets
        # SHA-pinned per the supply-chain-audit skill — NEVER use a
        # mutable tag here. The SHA 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        # corresponds to upstream's v2.1.1 (lookup method:
        # `gh api repos/softprops/action-gh-release/git/refs/tags/v2`).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.1.1
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          # Globs are matched against the workspace; missing paths
          # produce a warning, not an error, so a partial release
          # doesn't fail the whole pipeline.
          files: |
            artifacts/macos/**/*.dmg
            artifacts/macos/**/*.app
            artifacts/macos/aarch64/trail-collector
            artifacts/macos/x86_64/trail-collector
            artifacts/linux/deb/**/*.deb
            artifacts/linux/tarball/**/*.AppImage
          fail_on_unmatched_files: false
          generate_release_notes: false  # release-please produces the notes
