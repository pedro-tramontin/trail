# Fast CI workflow for the README status badge + per-commit regression
# detection.
#
# Why this workflow exists (and why draft-build.yml is not the answer):
#   - draft-build.yml only triggers on `pull_request` + `workflow_dispatch`.
#     It has never run on `main`, which is why the README's draft-build
#     badge has historically rendered as "no status" — the shields.io
#     URL `actions/workflow/status/<wf>.yml?branch=main` looks up runs
#     whose `head_branch == main`, and there are none.
#   - The full 3-platform Tauri debug build is overkill for a "did
#     main stay green" check. It costs ~10-12 min of CI minutes on
#     every merge and overlaps with the signed release.yml build
#     (which fires on the `trail-X.Y.Z` tag after release-please).
#   - The actual regression-detection surface that matters on main
#     is: lint, type-check, vitest, and `cargo clippy --workspace
#     --all-targets -- -D warnings` (no link, every default-warn
#     clippy lint demoted to deny — see the `rust-clippy` job below
#     and clippy.toml at the repo root). All four run on
#     ubuntu-latest in ~2-3 min.
#
# Triggers:
#   - `push: branches: [main]`           — keeps the README badge green
#                                          and catches post-merge breaks
#                                          that PR-only CI misses (e.g.,
#                                          release-please config edits,
#                                          renovate.json changes that
#                                          re-shape package.json).
#   - `pull_request: branches: [main]`   — fast pre-merge signal
#                                          alongside draft-build's
#                                          slower per-platform smoke
#                                          build. Splitting these out
#                                          means a lint or type failure
#                                          surfaces in <1 min instead
#                                          of after the 3-4 min Tauri
#                                          build.
#   - `workflow_dispatch`                — manual re-run.
#
# Why a single ubuntu runner, not 3-platform matrix:
#   - The lint + test jobs are platform-independent. The Rust
#     `cargo clippy` job uses `target/*-unknown-linux-gnu` which
#     matches the Tauri macOS-only audio code path's `cfg` gates
#     correctly (cpal / objc2 / block2 are gated to macOS in
#     src-tauri/Cargo.toml, so a Linux `cargo clippy` exercises the
#     Linux build path: the gating compiles out, the non-gated code
#     gets checked). The macOS-specific audio capture path is still
#     covered by draft-build's `draft-macos` job on every PR.
#   - Saves ~2x the CI minutes vs. duplicating across macos-latest
#     and windows-latest runners for commands whose output is
#     identical on all three.
#
# Why this is *not* a status check required for merging:
#   - draft-build.yml already provides the required gating signals
#     (pr-label-check + the three platform builds). This workflow
#     is informational: it keeps the README badge honest and gives
#     a fast feedback loop on PRs, but the branch protection rules
#     (configured separately in repo settings) still gate on
#     draft-build's checks.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# `contents: read` is enough — no PR-mutating actions run here.
permissions:
  contents: read

# Cancel any in-flight run for the same ref when a new commit lands.
# For a fast CI workflow, two builds racing is just wasted minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================================================================
  # Frontend lint (eslint)
  # ===================================================================
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # pnpm 10.18.0 matches the project's pnpm-workspace.yaml lockfile
      # version. MUST run before `actions/setup-node@v4` with
      # `cache: pnpm` — setup-node looks up `pnpm` on PATH to discover
      # the store directory, and fails with "Unable to locate
      # executable file: pnpm" if pnpm isn't on PATH yet. See
      # draft-build.yml for the full rationale.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      # pnpm 10+ requires Node.js 22.13+ (calls node:sqlite builtin).
      # Pin to 22 LTS to match pnpm@10.18.0.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  # ===================================================================
  # Frontend type-check (svelte-check + tsc)
  # ===================================================================
  # svelte-check covers the .svelte files; tsc --noEmit covers the
  # plain .ts files. Both run from the same `pnpm install` so the
  # node_modules setup is shared.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec svelte-check --tsconfig ./tsconfig.json
      - run: pnpm exec tsc --noEmit

  # ===================================================================
  # Frontend tests (vitest)
  # ===================================================================
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # ===================================================================
  # Rust workspace clippy (no link, no test run)
  # ===================================================================
  # `cargo clippy --workspace --all-targets -- -D warnings` exercises
  # every example, test, and bench target's compilation under clippy
  # with every default-warn lint demoted to deny. Catches the most
  # common post-merge breakage:
  #   - new rust code that doesn't compile under the stable toolchain
  #   - feature-flag / cfg-gate misconfigurations
  #   - workspace dependency version drift
  #   - `unused_imports` / `dead_code` / `unused_variables` and the
  #     rest of the default clippy `warn` set, demoted to errors
  #     via `-D warnings` (see clippy.toml for MSRV + behavior knobs).
  # Faster than `cargo test` (no link) and stricter than `cargo check`
  # (no separate `cargo check` job is needed — clippy compiles a
  # superset of what `cargo check` would and the Swatinem cache is
  # shared).
  # The actual `cargo test --workspace` run is exercised on PRs by
  # draft-build's per-platform jobs (which run the full test suite
  # on Linux as a side effect of `cargo test`).
  rust-clippy:
    name: rust-clippy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 on Linux transitively depends on the GTK/glib stack
      # (glib-sys / gobject-sys / gio-sys build scripts link against
      # system libs). Without these apt packages, clippy fails with
      # "failed to run custom build command for glib-sys". The
      # package list mirrors Tauri's official prerequisites:
      # https://v2.tauri.app/start/prerequisites/
      - name: Install Linux system deps (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev

      # dtolnay/rust-toolchain@stable picks up the toolchain pin
      # from rust-toolchain.toml at the repo root (stable-1.81.x).
      # The toolchain file is the source of truth for MSRV — if a
      # PR bumps it, this step uses the new toolchain, so CI will
      # exercise whatever the user committed. `components: clippy`
      # ensures the clippy component is installed; rust-toolchain.toml
      # already declares `components = ["clippy", "rustfmt"]` so this
      # is belt-and-braces for the case where a contributor edits
      # that file and forgets clippy.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Separate cache key from `trail-draft-*` (PR review artifacts)
      # and `trail-release-*` (prod builds) so ci runs don't evict
      # the warmer caches used by those workflows.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-ci

      # `--locked` so a stale Cargo.lock on the PR still fails with
      # a clear "needs cargo update" message rather than silently
      # being rewritten (the v0.4.2 regression that PR #170's
      # `--locked` flag was added to catch). `-D warnings` demotes
      # every default-warn clippy lint to deny; see clippy.toml for
      # the MSRV pin that prevents clippy from suggesting idioms
      # stable on 1.97 but not 1.81.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
