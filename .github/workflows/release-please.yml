name: Release Please

# Push-to-main trigger. This workflow runs `googleapis/release-please-action@v4`
# to open the release PR (changelog + version bump). When that PR is merged,
# release-please creates the GitHub Release as a DRAFT (per the
# `draft: true` setting in release-please-config.json) and pushes the
# `trail-X.Y.Z` tag.
#
# The downstream `.github/workflows/release.yml` is tag-triggered and
# picks up the tag to build + attach the binary assets, then flips the
# draft to a published (or prerelease) release.
#
# Why a separate workflow for release-please:
#   - release-please needs push-to-main trigger to scan for conventional
#     commits and decide the next version
#   - the build + asset-upload workflow needs tag-push trigger so it
#     only runs when there's actually a new release to build
#   - mixing the two triggers in one workflow creates the
#     "release-please ran on tag push and tried to create a release
#     that already exists" bug (the root cause of trail's earlier 0.2.0
#     empty-asset release)
#
# Token: must use a fine-grained PAT (RELEASE_PLEASE_TOKEN) with
# `Contents: Read and write` + `Pull requests: Read and write`. The
# default GITHUB_TOKEN is intentionally blocked by GitHub from triggering
# downstream workflows, which would break release.yml.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Safety net: release-please-action v4 with the `push-to-main`
      # trigger sometimes creates the GitHub Release as a draft but
      # fails to push the corresponding `trail-vX.Y.Z` tag. The
      # release then shows up as `untagged-<hash>` in the GitHub UI
      # and the downstream tag-triggered `release.yml` workflow never
      # fires. On the next release-please run the action sees no
      # upstream tag and tries to re-bump the entire history (open
      # a v0.5.0 PR whose changelog duplicates v0.4.0's).
      #
      # Belt-and-suspenders: if any draft release is missing its
      # tag, push the tag manually so the tag-triggered build
      # pipeline can run. We use the release's `target_commitish`
      # (which release-please already set correctly to the merge
      # commit on main) as the tag's commit SHA.
      - name: Push missing tags for draft releases
        if: github.event_name == 'push' && steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          # For every draft release, check if its tag exists on
          # origin. If not, push it manually using the release's
          # target_commitish (which release-please set to the merge
          # commit on main that introduced the version bump).
          gh api repos/${{ github.repository }}/releases \
            --jq '.[] | select(.draft == true) | "\(.tag_name) \(.target_commitish)"' \
            | while IFS=' ' read -r TAG SHA; do
                [ -z "$TAG" ] && continue
                if git ls-remote origin "refs/tags/$TAG" 2>/dev/null | grep -q .; then
                  echo "  TAG $TAG already exists — skipping"
                  continue
                fi
                echo "  Pushing tag $TAG -> $SHA"
                git push origin "$SHA:refs/tags/$TAG"
              done
