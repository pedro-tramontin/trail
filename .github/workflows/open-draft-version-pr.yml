# open-draft-version-pr workflow
#
# Reads the version of the open draft release (created by
# release-drafter.yml) and opens a `chore(draft-release): bump version
# to X.Y.Z` PR against main that updates the 4 version files
# (src-tauri/Cargo.toml, src-tauri/tauri.conf.json, package.json,
# crates/trail-collector/Cargo.toml) and prepends a new section
# to the two CHANGELOGs.
#
# Trigger: workflow_run on release-drafter.yml completion.
# This is the shape from the user's spec (2026-08-06): release-drafter
# runs on push to main and creates/updates the draft release; this
# workflow runs only after release-drafter completes, and uses the
# draft's version to open the version-bump PR.
#
# Why workflow_run (vs push: branches: [main]):
#   - Both PR merges to main AND the version-bump PR's auto-merge
#     push to main trigger release-drafter.yml. workflow_run from
#     release-drafter covers both cases.
#   - Crucially, this workflow should NOT trigger on its own
#     version-bump PR's merge. If we used `push: branches: [main]`,
#     the version-bump PR's merge commit would re-trigger this
#     workflow, which would then see "main is at 0.4.2, draft is at
#     0.4.2" and no-op (good). But if the PR's merge message
#     somehow diverged from the regex, we'd open a duplicate
#     version-bump PR against a tag that already exists. workflow_run
#     avoids the recursion concern entirely: this workflow only
#     runs in response to release-drafter, never to itself.
#   - workflow_run also avoids the noise of "every push to main
#     re-evaluates the draft" — the draft only changes when
#     release-drafter actually mutated it.
#
# Why we need the 5s sleep (Pitfall C from
# references/release-pipeline-2026-08-attach-debug-real-run-failures.md):
#   - workflow_run fires as soon as the upstream workflow's process
#     exits, which can be milliseconds before the final GitHub API
#     call (release-drafter's `gh release edit`) commits. Without
#     the sleep, this workflow's `gh release list` may return a
#     stale draft list missing the just-updated draft.
#   - 5s has been the working value in attach-debug-to-draft.yml
#     since the 2026-08-04 fix. The same value is used here.
#
# Concurrency:
#   - `cancel-in-progress: false` to avoid losing a run if two
#     release-drafter runs land in quick succession (e.g. two PR
#     merges within seconds). The first run should complete
#     naturally; we don't want to cancel-and-restart because the
#     restart would read the same draft and do the same work.
#   - Group key is `open-draft-version-pr-${{ github.event.workflow_run.id }}`
#     so each upstream release-drafter run's downstream is its own
#     concurrency group. Two unrelated PR merges won't cancel each
#     other.
#
# Permissions:
#   - contents: write    — to push the version-bump branch
#   - pull-requests: write — to open PRs and close superseded ones
#
# NOTE: the `permissions:` block below is the documented intent, but
# workflow_run triggers inherit the upstream workflow's permissions
# and CANNOT escalate them. In practice, the inherited GITHUB_TOKEN
# from release-drafter.yml has `contents: write, pull-requests: read`
# (release-drafter doesn't need PR-write). The `gh pr create` and
# `gh pr close` calls fail with
#   "GitHub Actions is not permitted to create or approve pull requests"
# because the API rejects PR-write operations from GITHUB_TOKEN when
# the workflow_run scope is read-only.
# To bypass this, the write steps (`Close superseded version-bump
# PRs` and `Open version-bump PR`) bind `GH_TOKEN` to the PAT
# stored in `secrets.CI_TRAIL` instead of the default GITHUB_TOKEN.
# The PAT is created with `repo:write` scope (classic) or
# `Contents: write + Pull requests: write` (fine-grained) and is
# therefore accepted by the API regardless of the workflow_run
# scope. Read-only steps (`Find open draft release`,
# `Pre-populate CHANGELOGs`) keep GITHUB_TOKEN since the inherited
# `contents: write` is sufficient for `gh release list` /
# `gh pr list`.
# Observed live: run 31177562328 (2026-08-07) failed at
# `gh pr create` with the workflow_run read-only rejection even
# though the `permissions:` block above declared write.
#
# Replacement for: version-bump.yml (which used `push: branches: [main]`
# as its trigger and was the source of the original line-316 typo
# bug fixed in PR #176). The new trigger is what the user wants
# (workflow_run from release-drafter), and the line-316 typo
# has been deliberately avoided (see the Pre-populate CHANGELOGs
# comment for the rationale).

name: open-draft-version-pr

on:
  workflow_run:
    workflows: ["release-drafter"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bump version files for (e.g. trail-v0.4.1). If blank, derive from the most recent open draft release.'
        required: false
        type: string

concurrency:
  group: open-draft-version-pr-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # persist-credentials: false keeps GITHUB_TOKEN out of
          # the git config so a malicious `gh api` from a sub-step
          # can't extract it via `git config --get`. We pass
          # GH_TOKEN explicitly via env in each step that needs it.
          persist-credentials: false

      - name: Find open draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # ----- Path 1: manual dispatch with explicit tag -----
          # If the caller passed `tag` via workflow_dispatch, use that
          # directly. This handles the case where the upstream
          # release-drafter workflow skipped (e.g. workflow_run didn't
          # fire because the upstream run was on a different branch)
          # and we need to retroactively bump version files for an
          # existing draft.
          if [ -n "$DISPATCH_TAG" ]; then
            if [[ ! "$DISPATCH_TAG" =~ ^trail-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Invalid tag '$DISPATCH_TAG' (expected trail-vX.Y.Z)"
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            TAG="$DISPATCH_TAG"
            echo "Manual dispatch: tag=$TAG"
            echo "has_draft=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ----- Path 2: workflow_run from release-drafter -----
          # 5s buffer to let release-drafter's last `gh release edit`
          # API call settle (Pitfall C, see header comment).
          sleep 5

          # NOTE: do NOT pass `--draft` to `gh release list` — that
          # flag doesn't exist on the cli/cli v2.x that ships on
          # GitHub-hosted runners. Filter via jq on the `isDraft`
          # JSON field instead — the [0].tagName // "" handles the
          # empty-array case cleanly.
          #
          # Also filter to `trail-v*` prefix to be defensive: if a
          # draft release for a different component ever exists (e.g.
          # `trail-collector-v*` once we add a parallel pipeline for
          # the collector), the sort-by-createdAt-reverse below would
          # otherwise pick whichever was created most recently,
          # even if it's the wrong component. Today there's only
          # one draft series in flight, so the prefix filter is a
          # no-op; tomorrow it's a safety net.
          DRAFT_TAG=$(gh release list \
            --json tagName,isDraft,createdAt \
            --jq '[.[] | select(.isDraft) | select(.tagName | startswith("trail-v"))] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
          if [ -z "$DRAFT_TAG" ]; then
            echo "::notice::No open draft release found; skipping version-bump."
            echo "has_draft=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Extract X.Y.Z from trail-vX.Y.Z
          VERSION="${DRAFT_TAG#trail-v}"
          echo "Draft tag: $DRAFT_TAG"
          echo "Next version: $VERSION"
          echo "has_draft=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$DRAFT_TAG" >> "$GITHUB_OUTPUT"

      - name: Skip if no draft
        if: steps.draft.outputs.has_draft != 'true'
        run: |
          echo "::notice::No draft to bump; exiting cleanly."
          exit 0

      - name: Read triggering commit message
        id: trigger
        if: steps.draft.outputs.has_draft == 'true'
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Read the merge commit that triggered release-drafter
          # (which triggered this workflow). The first line of the
          # commit message is the conventional-commits subject
          # (`feat:`, `fix:`, `chore:`, etc.).
          #
          # Extract the prefix (the part before `:` or `(scope):`).
          # If the prefix is `chore`, skip — chore commits don't
          # change the draft's content, so no checkpoint PR is
          # needed. Any other prefix (feat, fix, refactor, docs,
          # perf, build, ci, test, style, revert) opens a
          # checkpoint PR.
          #
          # This replaces the previous "main already at draft
          # version" check, which was wrong for the draft-only
          # mode: it would skip a checkpoint PR even when the
          # draft had new content (e.g. a `fix:` landed on main
          # but the version didn't change).
          HEAD_COMMIT=$(git log -1 --format=%s "$COMMIT_SHA" 2>/dev/null || echo "")
          COMMIT_PREFIX=$(echo "$HEAD_COMMIT" | sed -E 's/^([a-zA-Z]+)(\([^)]+\))?:.*/\1/')
          echo "head_commit=$HEAD_COMMIT" >> "$GITHUB_OUTPUT"
          echo "commit_prefix=$COMMIT_PREFIX" >> "$GITHUB_OUTPUT"
          if [ "$COMMIT_PREFIX" = "chore" ]; then
            echo "should_open=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_open=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if chore commit
        if: steps.trigger.outputs.should_open == 'false'
        run: |
          echo "::notice::Triggering commit is '${{ steps.trigger.outputs.commit_prefix }}:'; skipping checkpoint PR (chore commits don't change the draft)."
          exit 0

      - name: Close superseded version-bump PRs (if draft version changed)
        id: close_superseded
        if: steps.trigger.outputs.should_open == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
          # GH_TOKEN is bound to the PAT (CI_TRAIL), not the
          # default GITHUB_TOKEN, because this step does write
          # operations (`gh pr close`, `git push origin --delete`)
          # that the workflow_run-inherited GITHUB_TOKEN does not
          # have permission for. The PAT has `repo:write` scope
          # and bypasses the workflow_run read-only restriction.
          GH_TOKEN: ${{ secrets.CI_TRAIL }}
        run: |
          set -euo pipefail
          # Re-inject the auth token (PAT, see `env:` above) into
          # git config so `git push origin --delete` below can
          # authenticate. The Checkout step uses
          # `persist-credentials: false` (see comment there), which
          # strips the extraheader that actions/checkout would
          # normally set. Without the extraheader, `git push` fails
          # with "could not read Username for 'https://github.com'".
          # The `trap` removes the extraheader on exit so it doesn't
          # leak into subsequent steps.
          # Same mechanism works for both GITHUB_TOKEN and PATs
          # (both are bearer tokens accepted by GitHub via the same
          # `x-access-token:$TOKEN` basic-auth format).
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "$AUTH_HEADER"
          trap 'git config --local --unset-all http.https://github.com/.extraheader' EXIT
          # When release-drafter's next-version computation changes
          # (e.g. a new `feat:` PR landed on main after the previous
          # version-bump PR was opened, bumping the draft from 0.2.1
          # to 0.3.0), the previously-opened version-bump PR is for
          # a stale version and will never merge. Without this step,
          # the orphan accumulates on the PR list and reviewers have
          # to manually close it. This step finds any open
          # version-bump PR for a DIFFERENT version and closes it
          # with an explanatory comment, keeping the open-PR list
          # clean.
          #
          # Title regex: matches
          #   chore(draft-release): bump version to X.Y.Z
          # The version captured is the OLD version. We close
          # whenever OLD_VERSION != VERSION (the current draft
          # version). Same-version PRs are left alone (they're the
          # legitimate in-flight PR this run is about to update).
          #
          # Bug C documented in
          # references/release-pipeline-2026-08-attach-debug-real-run-failures.md
          # (trail PR #125 / #127, 2026-08-04).
          CLOSED=0
          for pr_num in $(gh pr list \
              --state open \
              --json number \
              --jq '.[].number'); do
            TITLE=$(gh pr view "$pr_num" --json title --jq '.title')
            if [[ "$TITLE" =~ ^chore\(release\):[[:space:]]bump[[:space:]]version[[:space:]]to[[:space:]]v?([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              OLD_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              if [ "$OLD_VERSION" != "$VERSION" ]; then
                echo "Closing superseded version-bump PR #$pr_num (was for $OLD_VERSION; draft is now $VERSION)"
                gh pr close "$pr_num" \
                  --comment "Superseded by the version bump to \`$VERSION\`; release-drafter's next-version computation changed after the previous push. This PR was for \`$OLD_VERSION\` but that release will never exist."
                # Best-effort branch delete — closing a PR doesn't
                # delete the remote ref by default. Use
                # `--delete-branch` semantics via direct git push
                # since `gh pr close --delete-branch` is not a
                # flag. If the branch delete fails (e.g. branch is
                # protected or already gone), we don't care — the
                # PR closure is what matters for cleanliness.
                BRANCH_TO_DELETE="infra/draft-bump-$OLD_VERSION"
                if git ls-remote --heads origin "$BRANCH_TO_DELETE" | grep -q "$BRANCH_TO_DELETE"; then
                  git push origin --delete "$BRANCH_TO_DELETE" 2>/dev/null || \
                    echo "::notice::Could not delete remote branch $BRANCH_TO_DELETE (likely protected or already removed); orphan ref will be cleaned up on next manual sweep."
                fi
                CLOSED=$((CLOSED + 1))
              fi
            fi
          done
          echo "Closed $CLOSED superseded version-bump PR(s)."
          echo "closed_count=$CLOSED" >> "$GITHUB_OUTPUT"

      - name: Update 4 version files
        if: steps.trigger.outputs.should_open == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
        run: |
          set -euo pipefail
          # 4 version files; same value to all of them per the
          # user's "Tauri and cargo can follow the same versions for
          # now" rule. Use python for the JSON files (jq would also
          # work but python is more readable for nested keys) and
          # sed for the Cargo.toml files.
          #
          # src-tauri/Cargo.toml
          sed -i "s/^version = \"[0-9]*\.[0-9]*\.[0-9]*\"/version = \"$VERSION\"/" \
            src-tauri/Cargo.toml
          # crates/trail-collector/Cargo.toml
          sed -i "s/^version = \"[0-9]*\.[0-9]*\.[0-9]*\"/version = \"$VERSION\"/" \
            crates/trail-collector/Cargo.toml
          # src-tauri/tauri.conf.json (top-level "version" key)
          python3 -c "
          import json
          with open('src-tauri/tauri.conf.json', 'r') as f:
              cfg = json.load(f)
          cfg['version'] = '$VERSION'
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
              f.write('\n')
          "
          # package.json (top-level "version" key)
          python3 -c "
          import json
          with open('package.json', 'r') as f:
              cfg = json.load(f)
          cfg['version'] = '$VERSION'
          with open('package.json', 'w') as f:
              json.dump(cfg, f, indent=2)
              f.write('\n')
          "
          echo "Updated 4 version files to $VERSION"
          echo "--- diff ---"
          git diff -- src-tauri/Cargo.toml src-tauri/tauri.conf.json \
            package.json crates/trail-collector/Cargo.toml

      - name: Update Cargo.lock to match the new versions
        if: steps.trigger.outputs.should_open == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
        run: |
          set -euo pipefail
          # After bumping the inline `version = "X.Y.Z"` in the two
          # Cargo.toml files, Cargo.lock still pins the OLD versions
          # until `cargo update` rewrites the [[package]] entries for
          # the two workspace members. Without this step, the
          # version-bump PR's CI fails on the `rust-clippy --locked`
          # gate in ci.yml (added in PR #182) with a clear
          # "needs cargo update" message, blocking the merge.
          #
          # History (the v0.4.2 regression):
          #   - PR #102 introduced the version-bump workflow without
          #     this step. Latent until PR #170 added `--locked` to
          #     ci.yml's cargo check, which then started surfacing the
          #     drift as a CI failure.
          #   - PR #173 was the first victim: its rust-check CI failed
          #     for hours, then was merged anyway via the 5ffa7d8 +
          #     e8d5618 hotfix pair.
          #   - Permanent fix: every version-bump workflow MUST run
          #     `cargo update -p trail -p trail-collector` (the two
          #     workspace members whose `version` field we just
          #     edited) + `git add Cargo.lock` BEFORE the commit
          #     step. The `-p <name>` flag rewrites ONLY the named
          #     package's lock entry, leaving everything else alone.
          #
          # Why two `-p` flags (one per workspace member):
          #   - `trail` (src-tauri/Cargo.toml) and `trail-collector`
          #     (crates/trail-collector/Cargo.toml) are the only two
          #     [[package]] entries in Cargo.lock whose version field
          #     we just changed. Running `cargo update` (no `-p`) would
          #     also re-resolve transitive deps against the registry
          #     and produce noisy lockfile churn. The `-p` flags scope
          #     the change to exactly what we need.
          cargo update -p trail -p trail-collector
          git add Cargo.lock
          echo "Updated Cargo.lock to match the new versions"
          echo "--- Cargo.lock diff ---"
          git diff -- Cargo.lock | head -30

      - name: Pre-populate CHANGELOGs (Keep a Changelog format)
        if: steps.trigger.outputs.should_open == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)

          # Gather the PRs that landed since the last release. We
          # use the GitHub API (gh pr list --state merged --base
          # main) rather than the draft's body, because the draft
          # body groups PRs into Keep a Changelog sections and we
          # want the raw list to drive the per-section render.
          #
          # NOTE: PRS_JSON is read by python3 via os.environ, but
          # it's a potentially large JSON blob. We pass it via env
          # (not as a command-line argument) to avoid argv-length
          # limits (`ARG_MAX` is ~128KB on Linux; the JSON can
          # exceed that for repos with many merged PRs).
          PRS_JSON=$(gh pr list --state merged --base main \
            --json title,number,labels,mergeCommit \
            --limit 100)

          # Step 1: categorize PRs into the 3 Keep-a-Changelog
          # sections (added / changed / fixed) based on the
          # conventional-commits prefix from the PR title. The
          # version-bump PR itself (`chore(draft-release): bump version to
          # X.Y.Z`) is the only `chore(draft-release):` PR that should
          # ever appear; everything else is chore/deps/ci/etc. and
          # falls into the "not user-facing" branch (omitted from
          # the changelog body).
          python3 - "$VERSION" "$TODAY" > /tmp/changelog_src.md <<'PY'
          import json, sys, re, os
          version, today = sys.argv[1], sys.argv[2]

          # Parse PR JSON from the PRS_JSON env var (passed via
          # the shell's `env: PRS_JSON: ...` block above). Default
          # to empty list if not set (defensive — should never
          # happen in practice).
          prs = json.loads(os.environ.get('PRS_JSON', '[]'))

          # Categorize by PR title prefix (Keep a Changelog sections)
          added, changed, fixed = [], [], []
          for pr in prs:
              title = pr.get('title', '')
              num = pr.get('number', 0)
              sha = ((pr.get('mergeCommit') or {}).get('oid') or '')[:7]
              entry = f"- {title} (#{num}) — `{sha}`"
              if re.match(r'^feat!:', title) or re.match(r'^refactor!:', title):
                  changed.append(entry)
              elif re.match(r'^feat:', title):
                  added.append(entry)
              elif re.match(r'^fix:', title):
                  fixed.append(entry)
              # else: chore/docs/ci/test/build/perf/style → omit

          print(f"## [{version}] - {today}")
          print()
          if added:
              print("### Added")
              print()
              for e in added:
                  print(e)
              print()
          if changed:
              print("### Changed")
              print()
              for e in changed:
                  print(e)
              print()
          if fixed:
              print("### Fixed")
              print()
              for e in fixed:
                  print(e)
              print()
          if not (added or changed or fixed):
              print("- No user-facing changes in this release.")
              print()
          PY

          # Step 2: prepend the new section to each CHANGELOG
          # while preserving the file's existing version sections.
          # Keep a Changelog's canonical layout is [preamble] +
          # [newest version] + [older versions], so each release
          # adds a section at the top.
          #
          # The previous version of this step used
          # `cat > CHANGELOG.md <<EOF ... EOF` which OVERWROTE
          # the entire file, destroying all prior version
          # sections. Bug first observed after v0.1.1: the
          # in-repo CHANGELOG went from `[0.1.0] + [0.1.1]` after
          # the v0.1.1 hand-write, to just `[0.2.0]` after the
          # v0.2.0 version-bump run, dropping both prior
          # versions. The fix below prepends a new section while
          # preserving any existing `## [VERSION] - DATE`
          # sections in reverse-chronological order.
          #
          # Edge cases:
          # - File doesn't exist yet: write preamble + new section.
          # - File has no `## [` lines (e.g. only preamble):
          #   write preamble + new section (preamble is regenerated
          #   identically so the diff stays small).
          # - File has malformed lines: we keep everything from the
          #   first `## [` line onward verbatim, so later bumps
          #   sort them out.
          #
          # CRITICAL: this is the step that had the line-316
          # duplicate-invocation bug in version-bump.yml (PR #176
          # fixed it). The duplicate was a buggy second invocation
          # of the section-generator script without its heredoc,
          # which truncated /tmp/changelog_src.md to 0 bytes
          # before the prepend step ran. The prepend step then
          # read an empty new_section and wrote the CHANGELOGs
          # with empty content, making the new section header
          # silently disappear from the commit. The fix was to
          # REMOVE the duplicate line. This file (open-draft-version-pr.yml)
          # has only the single correct invocation above; the
          # heredoc `<<'PY'` is present, so the script body is
          # fed via stdin correctly. Do NOT add a second invocation
          # of the section generator here.
          PRS_JSON="$PRS_JSON" python3 - /tmp/changelog_src.md \
            src-tauri/CHANGELOG.md \
            crates/trail-collector/CHANGELOG.md \
            "$VERSION" "$TODAY" <<'PY'
          import sys
          new_section_path, src_tauri_path, collector_path, version, today = sys.argv[1:6]
          with open(new_section_path) as f:
              new_section = f.read()
          preambles = {
              src_tauri_path: (
                  "# Changelog — Trail (src-tauri)\n"
                  "#\n"
                  "# All notable changes to the Trail desktop app (src-tauri)\n"
                  "# are documented in this file.\n"
                  "#\n"
                  "# The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),\n"
                  "# and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."
              ),
              collector_path: (
                  "# Changelog — trail-collector\n"
                  "#\n"
                  "# All notable changes to the trail-collector binary\n"
                  "# (the VPS-side collector) are documented in this file.\n"
                  "# The version is bumped in lockstep with src-tauri per\n"
                  "# the project's standing rule.\n"
                  "#\n"
                  "# The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),\n"
                  "# and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."
              ),
          }
          for path, preamble in preambles.items():
              tail = ""
              try:
                  with open(path) as f:
                      existing = f.read()
                  for i, line in enumerate(existing.splitlines(keepends=True)):
                      if line.startswith("## ["):
                          tail = "".join(existing.splitlines(keepends=True)[i:])
                          break
              except FileNotFoundError:
                  pass
              with open(path, "w") as f:
                  f.write(preamble + "\n\n")
                  f.write(new_section)
                  if tail:
                      f.write("\n" + tail)
              print(f"  Prepended [{version}] to {path} (tail: {len(tail.splitlines())} lines preserved)")
          PY

          echo "Prepended [$VERSION] section to both CHANGELOGs (prior sections preserved)"

      - name: Open version-bump PR
        if: steps.trigger.outputs.should_open == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
          TAG: ${{ steps.draft.outputs.tag }}
          # GH_TOKEN is bound to the PAT (CI_TRAIL), not the
          # default GITHUB_TOKEN, because this step does write
          # operations (`git push --force-with-lease`,
          # `gh pr create`) that the workflow_run-inherited
          # GITHUB_TOKEN does not have permission for. The PAT
          # has `repo:write` scope and bypasses the workflow_run
          # read-only restriction.
          GH_TOKEN: ${{ secrets.CI_TRAIL }}
        run: |
          set -euo pipefail
          # Re-inject the auth token (PAT, see `env:` above) into
          # git config so `git push --force-with-lease` below can
          # authenticate. The Checkout step uses
          # `persist-credentials: false` (see comment there), which
          # strips the extraheader that actions/checkout would
          # normally set. Without the extraheader, `git push` fails
          # with "could not read Username for 'https://github.com'".
          # The `trap` removes the extraheader on exit so it doesn't
          # leak into subsequent steps.
          # Same mechanism works for both GITHUB_TOKEN and PATs
          # (both are bearer tokens accepted by GitHub via the same
          # `x-access-token:$TOKEN` basic-auth format).
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "$AUTH_HEADER"
          trap 'git config --local --unset-all http.https://github.com/.extraheader' EXIT
          # Branch name: infra/draft-bump-X.Y.Z
          # (Phase-agnostic — previously `infra/8-2-bump-X.Y.Z` while
          # this workflow lived under the Phase 8 release-pipeline
          # refactor. The phase number was noise in the branch name.)
          BRANCH="infra/draft-bump-$VERSION"

          # Commit + push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Fetch the orphan branch tip from origin BEFORE the push
          # so `--force-with-lease` has a ref to lease against.
          # actions/checkout@v4 defaults to fetch-depth:1 (the
          # current branch only), so the runner's local repo has
          # no ref for `infra/draft-bump-X.Y.Z` on the first push
          # of a new version. `--force-with-lease` then fails with
          # "stale info" because it has nothing to lease against.
          # The `|| true` swallows the expected failure on the
          # first push (no remote tip yet); on subsequent pushes
          # the fetch returns the existing tip and
          # `--force-with-lease` works as designed.
          #
          # First observed in trail run 30982501307 (2026-08-05,
          # the post-merge run for the close-superseded-PRs fix
          # in #136). The reference's "Bug C's sibling" section
          # flagged this on 2026-08-04 as "planned, not yet
          # landed" — this is the landing.
          git fetch origin "$BRANCH" || true
          git add src-tauri/Cargo.toml \
                  src-tauri/tauri.conf.json \
                  package.json \
                  crates/trail-collector/Cargo.toml \
                  Cargo.lock \
                  src-tauri/CHANGELOG.md \
                  crates/trail-collector/CHANGELOG.md
          git commit -m "chore(draft-release): bump version to $VERSION"
          # Use --force-with-lease so a stale orphan branch from a
          # previous failed run (e.g. open-draft-version-pr.yml's
          # `gh pr create` failed after pushing the branch, leaving
          # a non-fast-forward tip) doesn't block the new push.
          # --force-with-lease only fails if the remote tip is NOT
          # the expected one (i.e. someone else pushed in
          # between), which is the correct safety check. Bare
          # `--force` would silently overwrite legitimate
          # concurrent pushes; `--force-with-lease` is the
          # consensus-safe variant. Rationale: failed runs leave
          # orphans at the exact tip we want to update; legitimate
          # concurrent pushes would advance the tip in a way
          # --force-with-lease detects and refuses.
          #
          # Requires the `git fetch origin $BRANCH || true` line
          # above to actually populate the local lease ref.
          git push --force-with-lease origin "$BRANCH" 2>&1 | tail -5

          # If a PR for this branch already exists, the
          # version-bump for this version is already in flight
          # (waiting for manual review per the Phase 8 design).
          # Don't try to open a duplicate — `gh pr create` will
          # refuse with "a pull request for branch X into branch
          # main already exists" and the whole workflow goes red.
          # Force-updating the branch tip above keeps the existing
          # PR's diff in sync with the new version files / CHANGELOGs,
          # which is the right behavior — the existing PR's review
          # state and comments are preserved.
          EXISTING_PR=$(gh pr list \
            --state open \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "::notice::PR #$EXISTING_PR already open for branch $BRANCH (version $VERSION); the force-updated branch tip is now reflected in the existing PR's diff. No new PR needed."
            exit 0
          fi

          # Write the PR body to a file to avoid YAML escape hell
          # with multi-line strings containing backticks and pipes.
          TODAY=$(date -u +%Y-%m-%d)
          cat > /tmp/pr_body.md <<EOF
          open-draft-version-pr.yml opened this PR after release-drafter updated the draft release \`$TAG\` to \`$VERSION\`.

          ## Changes in this PR

          - Bumps 4 version files to \`$VERSION\`:
            - \`src-tauri/Cargo.toml\`
            - \`src-tauri/tauri.conf.json\`
            - \`package.json\`
            - \`crates/trail-collector/Cargo.toml\` (lockstep with src-tauri)
          - Pre-populates \`src-tauri/CHANGELOG.md\` and \`crates/trail-collector/CHANGELOG.md\` with a new \`## [$VERSION] - $TODAY\` section in [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) format.

          ## What's next

          - Review the changelog entries + version bumps.
          - **Merge this PR manually** (auto-merge is disabled per the Phase 8 design).
          - \`debug-build.yml\` will fire on the merge commit and attach debug binaries to the draft release page for smoke-testing.

          Draft release: $TAG
          EOF

          # Open PR. auto-merge is intentionally NOT enabled —
          # the user reviews + merges manually per the Phase 8
          # design.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(draft-release): bump version to $VERSION" \
            --body-file /tmp/pr_body.md \
            || {
              echo "::error::gh pr create failed"
              exit 1
            }

          echo "Opened version-bump PR for $VERSION"
