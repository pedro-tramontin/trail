# promote workflow
#
# Phase 8 §8.2: fires when the user merges a
# `chore(release): bump version to vX.Y.Z` PR. Reads the merged
# version from the commit message, finds the matching draft
# release, builds prod binaries with tauri-action, attaches them
# to the draft, and flips the draft to published.
#
# Gate (the only reason this workflow doesn't fire on every push):
#   - The most-recent commit message must match
#     `^chore\(release\): bump version to v[0-9]+\.[0-9]+\.[0-9]+$`.
#   - This regex matches the commit message produced by
#     version-bump.yml's `git commit -m "chore(release): bump
#     version to $VERSION"`. Any other commit message (including
#     `chore(release): bump version to 0.1.0` without the `v`
#     prefix, or `chore(release): bump version to 0.1.0-rc.1`)
#     will not match.
#
# 3 parallel build jobs (Linux / macOS / Windows) match the
# existing release.yml pattern; tauri-action's `releaseDraft:
# true` reattaches to the existing draft (created by
# release-drafter). The `publish` job depends on all 3 builds
# and flips the draft → published via `gh release edit
# trail-vX.Y.Z --draft=false`.
#
# Token: GITHUB_TOKEN (not RELEASE_PLEASE_TOKEN), per the v0.3.55+
# convention.

name: promote

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote (e.g. trail-v0.1.1). If blank, derive from the most recent version-bump commit.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  # ----- Gate: only run if the most-recent commit is a version bump -----
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
      should_promote: ${{ steps.extract.outputs.should_promote }}
    steps:
      - name: Extract version from commit message
        id: extract
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # GitHub merges PRs with a "merge commit" whose subject
          # line is the PR title. For PR #107 the subject was:
          #   chore(release): bump version to 0.1.1 (#107)
          # Two differences from the original regex:
          # 1. No `v` prefix on the version. version-bump.yml
          #    produces `chore(release): bump version to 0.1.1`
          #    (no `v`). The `v` prefix was a release-please
          #    relic; we strip it if present and re-add it
          #    when computing TAG.
          # 2. Trailing `(#NNN)` suffix from GitHub's
          #    merge commit. The regex allows ` *(#NNN)?$` so
          #    both the literal version-bump commit (no suffix)
          #    and the merge commit (with PR number suffix)
          #    match.
          #
          # Also handle the case where the head_commit.message
          # is multi-line (PR body appended after a blank
          # line). Use only the first line.
          #
          # Manual recovery via workflow_dispatch: if the
          # caller passed `tag` (e.g. `trail-v0.1.1`), use that
          # directly. This handles the case where the promote
          # gate missed on a previous push (e.g. before the
          # regex fix in #112) and we need to retroactively
          # build+attach binaries to an existing draft.
          if [ -n "$DISPATCH_TAG" ]; then
            if [[ ! "$DISPATCH_TAG" =~ ^trail-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Invalid tag '$DISPATCH_TAG' (expected trail-vX.Y.Z)"
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            TAG="$DISPATCH_TAG"
            echo "Manual dispatch: tag=$TAG version=$VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "should_promote=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG" | head -1)
          if [[ "$COMMIT_MSG" =~ ^chore\(release\):[[:space:]]bump[[:space:]]version[[:space:]]to[[:space:]]v?([0-9]+)\.([0-9]+)\.([0-9]+)[[:space:]]*(\(#[0-9]+\))?$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            TAG="trail-v$VERSION"
            echo "Matched version-bump commit: $COMMIT_MSG"
            echo "Extracted version: $VERSION"
            echo "Tag: $TAG"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "should_promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Most-recent commit is not a version bump: $COMMIT_MSG"
            echo "should_promote=false" >> "$GITHUB_OUTPUT"
          fi

  # ----- Linux build (.deb + AppImage) -----
  build-linux:
    needs: gate
    if: needs.gate.outputs.should_promote == 'true'
    name: Build (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps (Tauri 2 prereqs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev libglib2.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-promote-linux
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install UI deps + build
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build Tauri bundle (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.gate.outputs.tag }}
          releaseName: "Trail ${{ needs.gate.outputs.tag }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/pedro-tramontin/trail/blob/${{ needs.gate.outputs.tag }}/CHANGELOG.md) for the full release notes."
          releaseDraft: true
          prerelease: false
          args: --bundles deb,appimage

  # ----- macOS build (aarch64) -----
  build-macos:
    needs: gate
    if: needs.gate.outputs.should_promote == 'true'
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-promote-mac
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install UI deps + build
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build Tauri bundle (macOS aarch64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.gate.outputs.tag }}
          releaseName: "Trail ${{ needs.gate.outputs.tag }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/pedro-tramontin/trail/blob/${{ needs.gate.outputs.tag }}/CHANGELOG.md) for the full release notes."
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      # Ad-hoc codesign the .app bundle as a defensive belt-
      # and-suspenders step. Tauri's `bundle.macOS.signingIdentity`
      # (set in src-tauri/tauri.conf.json) already ad-hoc-signs
      # during the build, so this step is normally a no-op
      # verification pass — but it protects against a future
      # regression where someone removes the signingIdentity
      # config and forgets to verify locally. The .dmg is
      # uploaded by the previous `tauri-apps/tauri-action`
      # step AFTER signing, so we don't need to re-upload.
      #
      # Path note: with `--target aarch64-apple-darwin`, the
      # .app is at `target/aarch64-apple-darwin/release/bundle/
      # macos/Trail.app` (NOT `src-tauri/target/...`). Same
      # fix as release.yml in PR #160.
      - name: Ad-hoc codesign .app bundle (defensive)
        if: runner.os == 'macOS'
        env:
          DEVELOPER_NAME: "Pedro Tramontin"
        run: |
          APP_PATH=$(find target -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::notice::No .app bundle found in target/; skipping defensive codesign."
            exit 0
          fi
          echo "Verifying ad-hoc codesign on $APP_PATH"
          codesign -dv "$APP_PATH" 2>&1 || {
            echo "::warning::$APP_PATH is not codesigned; applying ad-hoc sign as fallback."
            codesign --force --deep --sign "$DEVELOPER_NAME" "$APP_PATH"
          }

  # ----- Windows build (.msi + .exe) -----
  build-windows:
    needs: gate
    if: needs.gate.outputs.should_promote == 'true'
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: trail-promote-windows
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install UI deps + build
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build Tauri bundle (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.gate.outputs.tag }}
          releaseName: "Trail ${{ needs.gate.outputs.tag }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/pedro-tramontin/trail/blob/${{ needs.gate.outputs.tag }}/CHANGELOG.md) for the full release notes."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi

  # ----- Publish: flip draft → published -----
  publish:
    needs: [gate, build-linux, build-macos, build-windows]
    if: needs.gate.outputs.should_promote == 'true'
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Phase 10: attach-debug-to-draft.yml uploads 6 debug binaries
      # to the draft release on every push to main (skipped when a
      # version-bump PR is open). By the time promote.yml fires, the
      # draft release already has those 6 debug assets attached from
      # the most recent attach-debug run. We explicitly delete them
      # here before the prod build's tauri-action upload, so the
      # release ends with EXACTLY the 6 prod binaries and no leftover
      # .deb/.dmg/.msi debug artifacts.
      #
      # tauri-action's same-filename upload does replace by default
      # (verified by inspecting tauri-action@v0 source: it uses
      # octokit's uploadReleaseAsset with the existing asset's id,
      # which the GitHub API treats as overwrite). But explicit delete
      # is defensive: it surfaces any filename-shape mismatch (e.g.
      # macOS .app.tar.gz vs .app.tar.gz-dsym vs .app.tar.gz-debug)
      # as a clean log line instead of a silent duplicate-asset.
      - name: Delete existing assets (debug binary replacement)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          ASSET_IDS=$(gh release view "$TAG" --json assets --jq '.assets[].id')
          if [ -z "$ASSET_IDS" ]; then
            echo "No existing assets on draft $TAG — skipping delete step."
          else
            COUNT=$(echo "$ASSET_IDS" | wc -l)
            echo "Deleting $COUNT existing assets from draft $TAG..."
            echo "$ASSET_IDS" | while read -r id; do
              [ -z "$id" ] && continue
              gh api -X DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/releases/assets/$id"
              echo "  Deleted asset id=$id"
            done
            echo "All $COUNT existing assets deleted."
          fi
      - name: Flip draft → published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Publishing $TAG..."
          gh release edit "$TAG" --draft=false || {
            echo "::error::gh release edit failed; release may need manual promotion"
            exit 1
          }
          echo "Release $TAG is now live."
      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          echo "## Release $TAG published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** https://github.com/pedro-tramontin/trail/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
