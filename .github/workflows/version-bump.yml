# version-bump workflow
#
# Phase 8 §8.2: after release-drafter creates/updates a draft
# release on push-to-main, this workflow opens a PR that:
#   1. Extracts the next version from the open draft release
#      (`gh release list --draft --json tagName` → `trail-vX.Y.Z`).
#   2. Updates 4 version files:
#        - src-tauri/Cargo.toml          (Rust src-tauri)
#        - src-tauri/tauri.conf.json     (Tauri 2)
#        - package.json                  (npm)
#        - crates/trail-collector/Cargo.toml (lockstep with src-tauri)
#   3. Pre-populates src-tauri/CHANGELOG.md + crates/trail-collector/
#      CHANGELOG.md with the new version section in Keep a Changelog
#      format. The version-bump PR is the manual gate — when the
#      user merges it, promote.yml fires and builds prod binaries.
#
# Trigger: push to main. release-drafter has already run at this
# point (or is running in parallel; the Open Draft step uses
# `gh release list --draft` which is racy but idempotent — if the
# draft isn't ready, the next push will retry).
#
# Why a separate workflow (not part of release-drafter):
#   - release-drafter updates the GitHub Release (contents:write),
#     but it can't open a PR (pull-requests:write is a separate
#     permission, and release-drafter's action doesn't expose that
#     capability cleanly).
#   - The version-bump PR is the manual gate. Keeping it in its
#     own workflow means the drafter can fire on every push
#     (idempotent) while the PR gate stays a distinct, human-visible
#     event.
#
# Why no auto-merge on the version-bump PR:
#   - Per the user's explicit feedback in the 2026-08-03 morning
#     session: "I want to review and decide when that will happen."
#   - The PR is opened with auto-merge disabled; the user reviews
#     the changelog + version files, then merges.
#
# Token: RELEASE_PLEASE_TOKEN (a PAT), not GITHUB_TOKEN. Switched
# from GITHUB_TOKEN on 2026-08-04 because the repo's "Allow GitHub
# Actions to create and approve pull requests" setting is OFF (the
# GitHub Feb 2023 security default), and GITHUB_TOKEN is blocked from
# opening PRs when that setting is OFF. RELEASE_PLEASE_TOKEN is a PAT
# with repo scope, which bypasses the restriction because it acts
# on behalf of a user, not the github-actions[bot]. Note that this
# re-introduces secret-management overhead (rotation + scope audit),
# but it's the only path to making this workflow auto-create PRs
# without flipping the repo setting (which is a repo-wide policy
# decision that affects all workflows, not just this one).
#
# The PR created by this workflow is opened with auto-merge DISABLED
# per the Phase 8 §8.2 design — the user reviews + merges manually.
# `permissions: contents: write` (above) is still needed for the
# `git push` step; `pull-requests: write` is intentionally NOT set
# because RELEASE_PLEASE_TOKEN doesn't need it (PAT bypasses the
# workflow-level restriction).

name: version-bump

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find open draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          # Find the single open draft release. release-drafter
          # maintains exactly one draft at a time, so the .[0]
          # assumption is safe. If there's no draft, skip.
          #
          # gh v2.x removed the `--draft` flag from `gh release
          # list` (the documented flag is now `--exclude-drafts`).
          # The replacement pattern is: list all releases with
          # `isDraft` in the JSON, then filter via `--jq` to keep
          # only drafts, then take the first one. If multiple
          # drafts exist that's a release-drafter bug; we take
          # the most-recent one and log a warning.
          DRAFT_TAG=$(gh release list --json tagName,isDraft,createdAt \
            --jq '[.[] | select(.isDraft)] | sort_by(.createdAt) | reverse | .[0].tagName // ""')
          if [ -z "$DRAFT_TAG" ]; then
            echo "::notice::No open draft release found; skipping version-bump."
            echo "has_draft=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Extract X.Y.Z from trail-vX.Y.Z
          VERSION="${DRAFT_TAG#trail-v}"
          echo "Draft tag: $DRAFT_TAG"
          echo "Next version: $VERSION"
          echo "has_draft=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$DRAFT_TAG" >> "$GITHUB_OUTPUT"

      - name: Skip if no draft
        if: steps.draft.outputs.has_draft != 'true'
        run: |
          echo "::notice::No draft to bump; exiting cleanly."
          exit 0

      - name: Skip if main already at draft version
        id: already_at
        if: steps.draft.outputs.has_draft == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
        run: |
          # If a previous version-bump run already landed the
          # bump on main, the next push-to-main will find a
          # stale draft for the same version. Without this
          # guard, the workflow tries to push a new
          # `infra/8-2-bump-X.Y.Z` branch to origin where one
          # already exists, fails with `fetch first` (non-
          # fast-forward), and leaves the run red.
          #
          # Detect this by checking if main's version files
          # already match the draft's VERSION. If so, set
          # should_bump=false so all subsequent steps are
          # skipped by their `if:` guard. If not, set
          # should_bump=true and proceed.
          CURRENT=$(grep -oE '^version = "[0-9]+\.[0-9]+\.[0-9]+"' \
            src-tauri/Cargo.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "::notice::Main is already at version $VERSION (draft version); nothing to bump. Skipping."
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Main is at $CURRENT, draft is $VERSION — proceeding with bump."
          echo "should_bump=true" >> "$GITHUB_OUTPUT"

      - name: Close superseded version-bump PRs (if draft version changed)
        id: close_superseded
        if: steps.already_at.outputs.should_bump == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          # When release-drafter's next-version computation changes
          # (e.g. a new `feat:` PR landed on main after the previous
          # version-bump PR was opened, bumping the draft from 0.2.1
          # to 0.3.0), the previously-opened version-bump PR is for
          # a stale version and will never merge. Without this step,
          # the orphan accumulates on the PR list and reviewers have
          # to manually close it. This step finds any open
          # version-bump PR for a DIFFERENT version and closes it
          # with an explanatory comment, keeping the open-PR list
          # clean.
          #
          # Title regex: matches
          #   chore(release): bump version to X.Y.Z
          # The version captured is the OLD version. We close
          # whenever OLD_VERSION != VERSION (the current draft
          # version). Same-version PRs are left alone (they're the
          # legitimate in-flight PR this run is about to update).
          #
          # Bug C documented in
          # references/release-pipeline-2026-08-attach-debug-real-run-failures.md
          # (trail PR #125 / #127, 2026-08-04).
          CLOSED=0
          for pr_num in $(gh pr list \
              --state open \
              --json number \
              --jq '.[].number'); do
            TITLE=$(gh pr view "$pr_num" --json title --jq '.title')
            if [[ "$TITLE" =~ ^chore\(release\):[[:space:]]bump[[:space:]]version[[:space:]]to[[:space:]]v?([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              OLD_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              if [ "$OLD_VERSION" != "$VERSION" ]; then
                echo "Closing superseded version-bump PR #$pr_num (was for $OLD_VERSION; draft is now $VERSION)"
                gh pr close "$pr_num" \
                  --comment "Superseded by the version bump to \`$VERSION\`; release-drafter's next-version computation changed after the previous push. This PR was for \`$OLD_VERSION\` but that release will never exist."
                # Best-effort branch delete — closing a PR doesn't
                # delete the remote ref by default. Use
                # `--delete-branch` semantics via direct git push
                # since `gh pr close --delete-branch` is not a
                # flag. If the branch delete fails (e.g. branch is
                # protected or already gone), we don't care — the
                # PR closure is what matters for cleanliness.
                BRANCH_TO_DELETE="infra/8-2-bump-$OLD_VERSION"
                if git ls-remote --heads origin "$BRANCH_TO_DELETE" | grep -q "$BRANCH_TO_DELETE"; then
                  git push origin --delete "$BRANCH_TO_DELETE" 2>/dev/null || \
                    echo "::notice::Could not delete remote branch $BRANCH_TO_DELETE (likely protected or already removed); orphan ref will be cleaned up on next manual sweep."
                fi
                CLOSED=$((CLOSED + 1))
              fi
            fi
          done
          echo "Closed $CLOSED superseded version-bump PR(s)."
          echo "closed_count=$CLOSED" >> "$GITHUB_OUTPUT"

      - name: Update 4 version files
        if: steps.already_at.outputs.should_bump == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
        run: |
          set -euo pipefail
          # 4 version files; same value to all of them per the
          # user's "Tauri and cargo can follow the same versions for
          # now" rule. Use python for the JSON files (jq would also
          # work but python is more readable for nested keys) and
          # sed for the Cargo.toml files.
          #
          # src-tauri/Cargo.toml
          sed -i "s/^version = \"[0-9]*\.[0-9]*\.[0-9]*\"/version = \"$VERSION\"/" \
            src-tauri/Cargo.toml
          # crates/trail-collector/Cargo.toml
          sed -i "s/^version = \"[0-9]*\.[0-9]*\.[0-9]*\"/version = \"$VERSION\"/" \
            crates/trail-collector/Cargo.toml
          # src-tauri/tauri.conf.json (top-level "version" key)
          python3 -c "
          import json
          with open('src-tauri/tauri.conf.json', 'r') as f:
              cfg = json.load(f)
          cfg['version'] = '$VERSION'
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
              f.write('\n')
          "
          # package.json (top-level "version" key)
          python3 -c "
          import json
          with open('package.json', 'r') as f:
              cfg = json.load(f)
          cfg['version'] = '$VERSION'
          with open('package.json', 'w') as f:
              json.dump(cfg, f, indent=2)
              f.write('\n')
          "
          echo "Updated 4 version files to $VERSION"
          echo "--- diff ---"
          git diff -- src-tauri/Cargo.toml src-tauri/tauri.conf.json \
            package.json crates/trail-collector/Cargo.toml

      - name: Pre-populate CHANGELOGs (Keep a Changelog format)
        if: steps.already_at.outputs.should_bump == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)

          # Gather the PRs that landed since the last release. We
          # use the GitHub API (gh pr list --state merged --base
          # main) rather than the draft's body, because the draft
          # body groups PRs into Keep a Changelog sections and we
          # want the raw list to drive the per-section render.
          #
          # Trail's first post-cleanup release will be either
          # `trail-v0.1.1` (after a `fix:` PR) or `trail-v0.2.0`
          # (after a `feat:` PR). If there are no merged PRs in
          # the window, we still write the section header so the
          # CHANGELOG is well-formed.
          PRS_JSON=$(gh pr list --state merged --base main \
            --json title,number,labels,mergeCommit \
            --limit 100)

          python3 - "$VERSION" "$TODAY" <<'PY' > /tmp/changelog_src.md
          import json, sys, re, os
          version, today = sys.argv[1], sys.argv[2]

          # Parse PR JSON from stdin
          prs = json.loads(os.environ.get('PRS_JSON', '[]'))

          # Categorize by PR title prefix (Keep a Changelog sections)
          added, changed, fixed = [], [], []
          for pr in prs:
              title = pr.get('title', '')
              num = pr.get('number', 0)
              sha = ((pr.get('mergeCommit') or {}).get('oid') or '')[:7]
              entry = f"- {title} (#{num}) — `{sha}`"
              if re.match(r'^feat!:', title) or re.match(r'^refactor!:', title):
                  changed.append(entry)
              elif re.match(r'^feat:', title):
                  added.append(entry)
              elif re.match(r'^fix:', title):
                  fixed.append(entry)
              # else: chore/docs/ci/test/build/perf/style → omit

          print(f"## [{version}] - {today}")
          print()
          if added:
              print("### Added")
              print()
              for e in added:
                  print(e)
              print()
          if changed:
              print("### Changed")
              print()
              for e in changed:
                  print(e)
              print()
          if fixed:
              print("### Fixed")
              print()
              for e in fixed:
                  print(e)
              print()
          if not (added or changed or fixed):
              print("- No user-facing changes in this release.")
              print()
          PY
          PRS_JSON="$PRS_JSON" python3 - "$VERSION" "$TODAY" > /tmp/changelog_src.md

          # src-tauri/CHANGELOG.md — full repo
          cat > src-tauri/CHANGELOG.md <<EOF
          # Changelog — Trail (src-tauri)
          #
          # All notable changes to the Trail desktop app (src-tauri)
          # are documented in this file.
          #
          # The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
          # and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

          EOF
          cat /tmp/changelog_src.md >> src-tauri/CHANGELOG.md

          # crates/trail-collector/CHANGELOG.md — collector only.
          # Filter PRs that touch crates/trail-collector/. If no
          # PRs touch collector, write a "No collector-specific
          # changes" section.
          PRS_COLLECTOR=$(echo "$PRS_JSON" | python3 -c "
          import json, sys
          prs = json.load(sys.stdin)
          # release-drafter doesn't have a per-package PR filter,
          # so we approximate by re-fetching the files-changed
          # for each PR. For a small repo this is fine; for a
          # large repo, batch the call.
          # NOTE: this filter runs INSIDE the runner; we don't
          # have a JSON of file changes, so we just include the
          # same PRs in the collector CHANGELOG and let the
          # release notes be a superset. The user's standing rule
          # is that collector follows src-tauri in lockstep, so
          # any user-facing change to src-tauri is implicitly a
          # change to collector too.
          print(json.dumps(prs))
          ")
          cat > crates/trail-collector/CHANGELOG.md <<EOF
          # Changelog — trail-collector
          #
          # All notable changes to the trail-collector binary
          # (the VPS-side collector) are documented in this file.
          # The version is bumped in lockstep with src-tauri per
          # the project's standing rule.
          #
          # The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
          # and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

          EOF
          # Same content as src-tauri (lockstep versions)
          cat /tmp/changelog_src.md >> crates/trail-collector/CHANGELOG.md

          echo "Updated both CHANGELOGs for version $VERSION"

      - name: Open version-bump PR
        if: steps.already_at.outputs.should_bump == 'true'
        env:
          VERSION: ${{ steps.draft.outputs.version }}
          TAG: ${{ steps.draft.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Branch name: infra/8-2-bump-X.Y.Z
          BRANCH="infra/8-2-bump-$VERSION"

          # Commit + push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Fetch the orphan branch tip from origin BEFORE the push
          # so `--force-with-lease` has a ref to lease against.
          # actions/checkout@v4 defaults to fetch-depth:1 (the
          # current branch only), so the runner's local repo has
          # no ref for `infra/8-2-bump-X.Y.Z` on the first push
          # of a new version. `--force-with-lease` then fails with
          # "stale info" because it has nothing to lease against.
          # The `|| true` swallows the expected failure on the
          # first push (no remote tip yet); on subsequent pushes
          # the fetch returns the existing tip and
          # `--force-with-lease` works as designed.
          #
          # First observed in trail run 30982501307 (2026-08-05,
          # the post-merge run for the close-superseded-PRs fix
          # in #136). The reference's "Bug C's sibling" section
          # flagged this on 2026-08-04 as "planned, not yet
          # landed" — this is the landing.
          git fetch origin "$BRANCH" || true
          git add src-tauri/Cargo.toml \
                  src-tauri/tauri.conf.json \
                  package.json \
                  crates/trail-collector/Cargo.toml \
                  src-tauri/CHANGELOG.md \
                  crates/trail-collector/CHANGELOG.md
          git commit -m "chore(release): bump version to $VERSION"
          # Use --force-with-lease so a stale orphan branch from a
          # previous failed run (e.g. version-bump.yml's `gh pr
          # create` failed after pushing the branch, leaving a
          # non-fast-forward tip) doesn't block the new push.
          # --force-with-lease only fails if the remote tip is NOT
          # the expected one (i.e. someone else pushed in
          # between), which is the correct safety check. Bare
          # `--force` would silently overwrite legitimate
          # concurrent pushes; `--force-with-lease` is the
          # consensus-safe variant. Rationale: failed runs leave
          # orphans at the exact tip we want to update; legitimate
          # concurrent pushes would advance the tip in a way
          # --force-with-lease detects and refuses.
          #
          # Requires the `git fetch origin $BRANCH || true` line
          # above — without it, --force-with-lease fails with
          # "stale info" because the runner has no remote ref to
          # lease against on the first push.
          git push --force-with-lease -u origin "$BRANCH"

          # If a PR for this branch already exists, the
          # version-bump for this version is already in flight
          # (waiting for manual review per the Phase 8 design).
          # Don't try to open a duplicate — `gh pr create` will
          # refuse with "a pull request for branch X into branch
          # main already exists" and the whole workflow goes red
          # (Bug C in
          # references/release-pipeline-2026-08-attach-debug-real-run-failures.md,
          # second instance after the orphan-PR fix in #136).
          # Force-updating the branch tip above keeps the existing
          # PR's diff in sync with the new version files / CHANGELOGs,
          # which is the right behavior — the existing PR's review
          # state and comments are preserved.
          #
          # First observed in trail run 30982899974 (post-merge run
          # for the --force-with-lease fix in #137, 2026-08-05): the
          # orphan branch `infra/8-2-bump-0.3.0` from PR #127 caused
          # `gh pr create` to fail.
          EXISTING_PR=$(gh pr list \
            --state open \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "::notice::PR #$EXISTING_PR already open for branch $BRANCH (version $VERSION); the force-updated branch tip is now reflected in the existing PR's diff. No new PR needed."
            exit 0
          fi

          # Open PR. auto-merge is intentionally NOT enabled —
          # the user reviews + merges manually per the Phase 8
          # design.
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): bump version to $VERSION" \
            --body "Phase 8 §8.2 version-bump for the open draft release \`$TAG\`.

          ## Changes in this PR

          - Bumps 4 version files to \`$VERSION\`:
            - \`src-tauri/Cargo.toml\`
            - \`src-tauri/tauri.conf.json\`
            - \`package.json\`
            - \`crates/trail-collector/Cargo.toml\` (lockstep with src-tauri)
          - Pre-populates \`src-tauri/CHANGELOG.md\` and \`crates/trail-collector/CHANGELOG.md\` with a new \`## [$VERSION] - $(date -u +%Y-%m-%d)\` section in [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) format.

          ## What's next

          - Review the changelog entries + version bumps.
          - **Merge this PR manually** (auto-merge is disabled per the Phase 8 design).
          - \`promote.yml\` will fire on the merge commit and build prod binaries + flip the draft to published.

          Draft release: $TAG" \
            || {
              echo "::error::gh pr create failed"
              exit 1
            }

          echo "Opened version-bump PR for $VERSION"
