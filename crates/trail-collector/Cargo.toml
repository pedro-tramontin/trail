[package]
name = "trail-collector"
# Per-crate inline version (not `version.workspace = true`) per talon
# issue #2111: release-please bumps workspace-member versions by walking
# `extraFiles` in release-please-config.json, and only handles inline
# versions — `version.workspace = true` is invisible to that walker.
# The workspace root + each member's `[package].version` are kept in
# lockstep manually; release-please rewrites both on every release.
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
# `cargo install trail-collector --git <repo>` discoverability metadata.
# Without these, `cargo install --list` shows a blank tile and the crates.io
# page (if ever published) would lack the install instructions. They are
# the difference between "the binary installs fine but looks orphaned" and
# "the binary shows up with a description, homepage, and license".
description = "Trail SSH collector — runs on the VPS, scrapes and ships activity"
homepage = "https://github.com/pedro-tramontin/trail"
repository = "https://github.com/pedro-tramontin/trail"
license.workspace = true

[[bin]]
name = "trail-collector"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
walkdir = { workspace = true }
icalendar = { workspace = true }
rusqlite = { workspace = true }
# Layer 1 (webcal/ICS URL subscription) per-proposal
# §"Layer 1 — Webcal/ICS URL subscription". The remote
# calendar collector (`crates/trail-collector/src/collectors/
# calendar/remote_calendar.rs`) does a one-shot HTTP GET per
# URL. We use the workspace-pinned reqwest (rustls-tls only,
# no native-tls; the `blocking` feature is enabled so the
# sync collector binary can call `reqwest::blocking::Client`
# without pulling tokio into a crate that doesn't otherwise
# need it — src-tauri uses the async `reqwest::Client` from
# the same pin and that path is unaffected) so the musl
# cross-compile doesn't drag in OpenSSL — same rationale as
# `src-tauri/Cargo.toml`'s `reqwest` pin. Pinned here (not
# inherited from the workspace `dependencies` table) because
# the existing `trail-collector` Cargo.toml uses inline dep
# entries everywhere; changing that pattern is out of scope.
reqwest = { workspace = true }
# `tempfile` is needed at runtime by the browser-history readers
# (they copy locked browser SQLite DBs to a temp file before
# opening them — plan
# `.hermes/plans/2026-08-11_browser-history-collector.md` §D2). It
# remains in `[dev-dependencies]` too because unit tests use it
# for fixture directory creation; pinning it here as a regular
# dependency is fine — it adds ~zero to the binary size, the
# crate is `no_std`-friendly, and avoiding the prod-vs-dev split
# prevents a single-crate path that would otherwise need both
# `cfg(test)` and runtime builds.
tempfile = { workspace = true }

# macOS-only target-conditional deps. The same story as the
# `src-tauri` crate: `objc2` / `objc2-foundation` / `block2` are the
# 2026-current macOS binding stack, and `objc2-event-kit` (with
# `default-features = false` + the `EKEvent` / `EKEventStore` /
# `EKObject` / `EKTypes` feature set) gives us EventKit access
# without dragging `objc2-app-kit` (and the AppKit dependency it
# pulls in) into the statically-linked musl build. The
# non-macOS branch in `collectors/calendar/ical.rs` is the only
# `calendar::run` path that compiles on Linux.
#
# Why this is target-conditional and not always-built: the
# `block2` crate transitively links CoreFoundation, which is
# macOS-only; turning it on unconditionally would break the
# Linux build. The `default-features = false` on
# `objc2-event-kit` is the additional hardening that keeps AppKit
# out of the macOS collector binary (AppKit needs NSApplication
# runloop plumbing that the headless collector subprocess does
# not provide — see `crates/trail-collector/src/collectors/
# calendar/eventkit.rs`'s stub note for the long version).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
block2 = { workspace = true }
objc2-event-kit = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Cross-compile contract for the VPS ship. The `trail-collector` binary
# lands on the VPS as a single, statically-linked `x86_64-unknown-linux-musl`
# artifact with zero runtime deps (no glibc, no musl loader, no shared libs).
#
# The build pipeline that produces that artifact lives in two places:
#
#   1. The `build.rs` at the crate root — it pins the link-arg to
#      `-static` when the active target is `x86_64-unknown-linux-musl`
#      and emits a `cargo:warning=` when a developer builds for any
#      other target (the build still succeeds; the warning is a hint).
#
#   2. The laptop-side invocation:
#        cargo build --release -p trail-collector --target x86_64-unknown-linux-musl
#      The macOS developer laptop runs this with the musl target +
#      `brew install FiloSottile/musl-cross/musl-cross` for the C linker.
#      The Linux CI/build host (this one) does NOT install the musl
#      target — the on-host build is for dev/test, not for shipping.
#
# The produced binary at `target/x86_64-unknown-linux-musl/release/
# trail-collector` is then picked up by `scripts/install-collector.sh`,
# which `scp`s it to the VPS, `chmod +x`s it, and installs a `*/5 * * * *`
# cron entry that runs `trail-collector --config ~/.trail/collector.json once`.
[package.metadata.musl]
# The exact target triple the install script + the macOS cross-compile
# invocation both reference. Keep all three in sync.
target = "x86_64-unknown-linux-musl"
# The C linker (on macOS, the brew-installed musl-cross toolchain;
# on Linux, the host's `musl-gcc` if present). The build.rs / the
# laptop-side invocation pass this via the standard `CC_x86_64-unknown-linux-musl`
# env var convention; the metadata block just documents the expected
# toolchain shape.
linker_hint = "musl-gcc (Linux) or FiloSottile/musl-cross/musl-cross (macOS)"
# Where the artifact lands after the cross-compile. The install script
# reads from this path; the build.rs and `tauri build` pipeline also
# know about it.
artifact = "target/x86_64-unknown-linux-musl/release/trail-collector"
# Where `tauri build`'s `bundle.resources` expects to find the binary
# when packaging the Tauri app. (Item 1-1's tauri.conf.json already
# points at this path; the build pipeline populates it before bundling.)
bundled = "src-tauri/resources/trail-collector"
